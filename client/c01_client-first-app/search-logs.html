<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Logs Viewer - AI Private Search</title>
    <link rel="stylesheet" href="shared/styles.css">
    <script src="shared/license-checker.js"></script>
    <script src="shared/utils/apiConfig.js"></script>
    <script src="csrf.js"></script>
    <script type="module" src="shared/common.js"></script>
    <script>
        // Load theme immediately to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            if (!savedTheme) {
                localStorage.setItem('theme', theme);
            }
        })();
    </script>
</head>
<body class="search-logs-page">
    <div id="header-placeholder"></div>

    <div class="page-content">
        <div class="logs-container">
            <h1>Search Logs Viewer</h1>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" class="filter-input">
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" class="filter-input">
                </div>
                <div class="filter-group">
                    <label for="searchType">Search Type</label>
                    <select id="searchType" class="filter-input">
                        <option value="">All Types</option>
                        <option value="line-search">Line Search</option>
                        <option value="document-search">Document Search</option>
                        <option value="smart-search">Smart Search</option>
                        <option value="hybrid-search">Hybrid Search</option>
                        <option value="ai-direct">AI Direct</option>
                        <option value="ai-document-chat">AI Document Chat</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" onclick="loadLogs()">Filter Logs</button>
                </div>
                <div class="filter-group prem-only">
                    <label>&nbsp;</label>
                    <button class="btn btn-success" onclick="exportToDatabase()">Export to Database</button>
                </div>
            </div>

            <div class="logs-table">
                <div id="loading" class="loading">Loading logs...</div>
                <div id="no-logs" class="no-logs hidden">No logs found for the selected criteria.</div>
                <table id="logsTable" class="table hidden">
                    <thead>
                        <tr>
                            <th>Date/Time</th>
                            <th>Search Type</th>
                            <th>Query</th>
                            <th>Collection</th>
                            <th>Model</th>
                            <th>Results</th>
                            <th>Duration</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        
        async function loadLogs() {
            const loading = document.getElementById('loading');
            const noLogs = document.getElementById('no-logs');
            const table = document.getElementById('logsTable');
            
            loading.style.display = 'block';
            noLogs.classList.add('hidden');
            table.classList.add('hidden');
            
            try {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const searchType = document.getElementById('searchType').value;
                
                const params = new URLSearchParams();
                if (startDate) params.append('startDate', startDate);
                if (endDate) params.append('endDate', endDate);
                if (searchType) params.append('searchType', searchType);
                
                const response = await fetch(`${window.API_BASE_URL}/api/search-logs?${params}`);
                if (!response.ok) throw new Error('Failed to load logs');
                
                allLogs = await response.json();
                displayLogs(allLogs);
                
            } catch (error) {
                console.error('Error loading logs:', error);
                loading.style.display = 'none';
                noLogs.classList.remove('hidden');
                noLogs.textContent = 'Error loading logs: ' + error.message;
            }
        }
        
        function displayLogs(logs) {
            const loading = document.getElementById('loading');
            const noLogs = document.getElementById('no-logs');
            const table = document.getElementById('logsTable');
            const tbody = document.getElementById('logsBody');
            
            loading.style.display = 'none';
            
            if (!logs || logs.length === 0) {
                noLogs.classList.remove('hidden');
                table.classList.add('hidden');
                return;
            }
            
            tbody.innerHTML = '';
            
            logs.forEach(log => {
                const row = document.createElement('tr');
                
                const formatDate = (dateStr) => {
                    const date = new Date(dateStr);
                    return date.toLocaleString();
                };
                
                const getStatusClass = (log) => {
                    if (log.error) return 'status-error';
                    return 'status-success';
                };
                
                const getStatusText = (log) => {
                    if (log.error) return 'Error';
                    return 'Success';
                };
                
                row.innerHTML = `
                    <td>${formatDate(log.timestamp)}</td>
                    <td>${log.searchType || 'N/A'}</td>
                    <td title="${log.prompt || log.query || ''}">${(log.prompt || log.query) ? (log.prompt || log.query).substring(0, 50) + ((log.prompt || log.query).length > 50 ? '...' : '') : 'N/A'}</td>
                    <td>${log.collectionName || log.collection || 'N/A'}</td>
                    <td>${log.searchModel || 'N/A'}</td>
                    <td>${log.documentsFound || log.resultCount || 0}</td>
                    <td>${log.searchDurationSeconds ? log.searchDurationSeconds.toFixed(1) + 's' : (log.duration ? (log.duration / 1000).toFixed(1) + 's' : 'N/A')}</td>
                    <td><span class="status ${getStatusClass(log)}">${getStatusText(log)}</span></td>
                `;
                
                tbody.appendChild(row);
            });
            
            noLogs.classList.add('hidden');
            table.classList.remove('hidden');
        }
        
        async function exportToDatabase() {
            if (!allLogs || allLogs.length === 0) {
                alert('No logs to export. Please load logs first.');
                return;
            }
            
            if (!confirm(`Export ${allLogs.length} log entries to database?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${window.API_BASE_URL}/api/search-logs/export-logs-to-database`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ logs: allLogs })
                });
                
                if (!response.ok) throw new Error('Export failed');
                
                const result = await response.json();
                alert(`Successfully exported ${result.exported} logs to database.`);
                
            } catch (error) {
                console.error('Export error:', error);
                alert('Export failed: ' + error.message);
            }
        }
        
        // Page initialization (template pattern)
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Search logs page loaded');
            
            // Wait a moment for common.js, then initialize
            setTimeout(() => {
                initializePage();
            }, 100);
        });
        
        function initializePage() {
            console.log('Initializing search logs page');
            
            // Access user info (set by common.js)
            if (window.currentUser) {
                console.log('Current user:', window.currentUser);
                console.log('User tier:', window.userTier);
            }
            
            
            // Set default date range (last 7 days)
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
            document.getElementById('startDate').value = weekAgo.toISOString().split('T')[0];
            
            loadLogs();
        }

    </script>

    <div id="footer-placeholder"></div>
</body>
</html>
