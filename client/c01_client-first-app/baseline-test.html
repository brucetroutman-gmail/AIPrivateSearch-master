<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseline Test — AIPrivateSearch</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="csrf.js"></script>
  <script src="shared/utils/apiConfig.js"></script>
  <script src="shared/license-checker.js"></script>
  <script src="shared/startup-license-check.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script src="shared/utils/lineSearchFormatter.js"></script>
  <script src="shared/utils/searchManager.js"></script>
  <script type="module">
    import { exportToDatabase } from './shared/common.js';
    window._exportToDatabase = exportToDatabase;
  </script>
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      if (!localStorage.getItem('theme')) localStorage.setItem('theme', t);
    })();
  </script>
  <style>
    .test-container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .progress-bar-wrap { background: var(--border-color); border-radius: 4px; height: 8px; margin: 1rem 0; }
    .progress-bar { background: var(--primary); height: 8px; border-radius: 4px; transition: width 0.3s; }
    .query-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; margin: 1rem 0; }
    .query-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .query-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
    .response-area { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 1rem; min-height: 80px; margin: 1rem 0; }
    .score-card { background: var(--card-bg); border: 2px solid var(--primary); border-radius: 8px; padding: 2rem; text-align: center; }
    .score-number { font-size: 3rem; font-weight: 700; color: var(--primary); }
    .score-pct { font-size: 1.5rem; color: var(--text-muted); }
    .result-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; align-items: center; }
    .hidden { display: none !important; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-fact { background: #e3f2fd; color: #1565c0; }
    .badge-analysis { background: #f3e5f5; color: #6a1b9a; }
    .badge-creative { background: #e8f5e9; color: #2e7d32; }
    [data-theme="dark"] .badge-fact { background: #1a3a5c; color: #90caf9; }
    [data-theme="dark"] .badge-analysis { background: #3a1a5c; color: #ce93d8; }
    [data-theme="dark"] .badge-creative { background: #1a3a1a; color: #a5d6a7; }
    .elapsed { font-size: 0.75rem; color: var(--text-muted); }
    .score-pill { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: var(--input-bg); color: var(--text-color); }
    .db-badge { font-size: 0.7rem; color: var(--text-muted); margin-left: 0.5rem; }
    .current-query { border-color: var(--primary) !important; }
    .running-indicator { display: inline-block; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="test-container">
    <h2>📋 Baseline Test — Document Collections</h2>
    <p style="color:var(--text-muted)">Runs all 15 queries automatically with AI scoring. Results saved to MySQL.</p>

    <!-- Setup -->
    <div id="setupSection" class="query-card">
      <div class="query-meta">Setup</div>
      <div style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;">
        <div>
          <label style="font-size:0.85rem;display:block;margin-bottom:4px;">Search Model</label>
          <select id="modelSelect" style="padding:0.5rem;border:1px solid var(--border-color);border-radius:4px;background:var(--input-bg);color:var(--text-color);min-width:200px;">
            <option value="">Loading...</option>
          </select>
        </div>
        <div>
          <label style="font-size:0.85rem;display:block;margin-bottom:4px;">Score Model</label>
          <select id="scoreModelSelect" style="padding:0.5rem;border:1px solid var(--border-color);border-radius:4px;background:var(--input-bg);color:var(--text-color);min-width:200px;">
            <option value="">Loading...</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="startTests()">▶ Run Baseline Test</button>
      </div>
    </div>

    <!-- Progress -->
    <div id="progressSection" class="hidden">
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-muted);">
        <span id="progressLabel">Running query 1 of 15...</span>
        <span id="scoreLabel">Avg score: —</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      <div id="currentQueryInfo" style="font-size:0.85rem;color:var(--text-muted);margin-top:0.25rem;"></div>
    </div>

    <!-- Live results list (fills as tests complete) -->
    <div id="liveResults"></div>

    <!-- Final summary -->
    <div id="resultsSection" class="hidden">
      <div class="score-card">
        <div class="score-number" id="finalScore"></div>
        <div class="score-pct" id="finalPct"></div>
        <div style="margin-top:0.5rem;font-size:0.85rem;color:var(--text-muted);" id="finalMeta"></div>
        <div style="margin-top:0.25rem;font-size:0.8rem;" id="dbStatus"></div>
      </div>
      <div style="margin-top:1rem;display:flex;gap:1rem;">
        <button class="btn btn-info" onclick="copyResults()">📋 Copy Results</button>
        <button class="btn btn-secondary" onclick="location.reload()">↺ Run Again</button>
      </div>
    </div>
  </div>

  <script>
    const TESTS = [
      { id:'M1', collection:'Sample_Medical-Practice', type:'fact',     query:'Find patients with diabetes' },
      { id:'M2', collection:'Sample_Medical-Practice', type:'fact',     query:'What medications is William Adams taking?' },
      { id:'M3', collection:'Sample_Medical-Practice', type:'fact',     query:'Find all patients with cancer' },
      { id:'M4', collection:'Sample_Medical-Practice', type:'analysis', query:'Compare treatment approaches for hip vs knee replacement patients' },
      { id:'M5', collection:'Sample_Medical-Practice', type:'creative', query:'Summarize the types of conditions treated at this practice' },
      { id:'L1', collection:'Sample_Law-Office',       type:'fact',     query:'Which clients have durable power of attorney documents?' },
      { id:'L2', collection:'Sample_Law-Office',       type:'fact',     query:'Show upcoming appointments' },
      { id:'L3', collection:'Sample_Law-Office',       type:'analysis', query:'What are the most common types of estate planning documents in this collection?' },
      { id:'F1', collection:'Sample_Federalist-Papers',type:'fact',     query:'What arguments does Hamilton make for a strong central government?' },
      { id:'F2', collection:'Sample_Federalist-Papers',type:'analysis', query:'Compare the arguments for Union vs arguments against it in these papers' },
      { id:'F3', collection:'Sample_Federalist-Papers',type:'creative', query:'Summarize the main themes of the Federalist Papers' },
      { id:'E1', collection:'Sample_My-Emails',        type:'fact',     query:'Find emails about parts orders' },
      { id:'E2', collection:'Sample_My-Emails',        type:'fact',     query:'What parts were ordered from the supplier?' },
      { id:'E3', collection:'Sample_My-Emails',        type:'analysis', query:'What is the main business relationship described in these emails?' },
      { id:'E4', collection:'Sample_My-Emails',        type:'fact',     query:'Find emails about monthly reports' },
    ];

    let results = [];
    let currentModel = '';
    let currentScoreModel = '';
    let appVersion = '';

    function getVersion() {
      return document.querySelector('.app-version')?.textContent?.trim() || '';
    }

    async function loadModels() {
      try {
        const r = await fetch(`${window.API_BASE_URL}/api/config/models-list.json`);
        const d = await r.json();
        const searchModels = d.models.filter(m => m.category === 'search');
        const allModels = d.models;

        const sel = document.getElementById('modelSelect');
        sel.innerHTML = '';
        searchModels.forEach(m => {
          const o = document.createElement('option');
          o.value = m.modelName;
          o.textContent = `${m.modelName} (${m.size})`;
          sel.appendChild(o);
        });
        const preferred = searchModels.find(m => m.modelName.includes('llama3.1') || m.modelName.includes('llama3.3'));
        if (preferred) sel.value = preferred.modelName;

        const scoreSel = document.getElementById('scoreModelSelect');
        scoreSel.innerHTML = '';
        allModels.forEach(m => {
          const o = document.createElement('option');
          o.value = m.modelName;
          o.textContent = `${m.modelName} (${m.size})`;
          scoreSel.appendChild(o);
        });
        // Default score model to same as search model
        if (preferred) scoreSel.value = preferred.modelName;
      } catch(e) { console.error('Failed to load models', e); }
    }

    async function startTests() {
      currentModel = document.getElementById('modelSelect').value;
      currentScoreModel = document.getElementById('scoreModelSelect').value;
      appVersion = getVersion();
      if (!currentModel) { alert('Please select a search model'); return; }
      if (!currentScoreModel) { alert('Please select a score model'); return; }

      runId = null;
      results = [];
      document.getElementById('setupSection').classList.add('hidden');
      document.getElementById('progressSection').classList.remove('hidden');
      document.getElementById('liveResults').innerHTML = '';

      for (let i = 0; i < TESTS.length; i++) {
        updateProgress(i);
        const result = await runQuery(TESTS[i], i);
        results.push(result);
        renderResultRow(result, i);
        updateProgressScore();
      }

      showSummary();
    }

    function updateProgress(index) {
      const t = TESTS[index];
      document.getElementById('progressLabel').textContent = `Running query ${index + 1} of ${TESTS.length}...`;
      document.getElementById('progressBar').style.width = `${(index / TESTS.length) * 100}%`;
      document.getElementById('currentQueryInfo').innerHTML =
        `<span class="running-indicator">⏳</span> <strong>${t.id}</strong> — ${t.query}`;
    }

    function updateProgressScore() {
      const scored = results.filter(r => r.weighted_score_pct != null);
      if (scored.length === 0) {
        document.getElementById('scoreLabel').textContent = 'Avg score: —';
        return;
      }
      const avg = Math.round(scored.reduce((s, r) => s + r.weighted_score_pct, 0) / scored.length);
      document.getElementById('scoreLabel').textContent = `Avg score: ${avg}%`;
    }

    async function runQuery(test, index) {
      const start = Date.now();
      try {
        const settings = await window.searchManager.getCollectionSettings(test.collection);
        const { search } = await import('./services/api.js');
        const data = await search(
          test.query,
          true,                   // score
          currentModel,
          settings.temperature,
          settings.contextSize,
          null,                   // systemPrompt
          null,                   // systemPromptName
          settings.tokenLimit,
          'Documents Only',       // sourceType
          `BT-${test.id}`,        // testCode
          test.collection,
          false,                  // showChunks
          currentScoreModel,
          false,                  // addMetaPrompt
          'ai-document-chat'      // searchType
        );
        const elapsed = Date.now() - start;

        const record = {
          ...test,
          elapsed_ms: elapsed,
          response_excerpt: data.response?.substring(0, 300) || '',
          accurate_score: data.scores?.accuracy || null,
          relevant_score: data.scores?.relevance || null,
          organized_score: data.scores?.organization || null,
          weighted_score_pct: data.scores?.total || null,
          error: null
        };

        const dbSaved = await saveToDatabase(data, test);
        record.db_saved = dbSaved;
        return record;

      } catch(e) {
        return {
          ...test,
          elapsed_ms: Date.now() - start,
          response_excerpt: null,
          accurate_score: null, relevant_score: null, organized_score: null, weighted_score_pct: null,
          error: e.message,
          db_saved: false
        };
      }
    }

    async function saveToDatabase(data, test) {
      try {
        await window._exportToDatabase(
          data,
          `Baseline ${appVersion}`,
          `${test.type}: ${test.query.substring(0, 80)}`
        );
        return true;
      } catch(e) {
        console.error('DB save failed:', e.message);
        return false;
      }
    }

    function renderResultRow(r, index) {
      const container = document.getElementById('liveResults');
      const row = document.createElement('div');
      row.className = 'result-row';

      const scoreText = r.weighted_score_pct != null
        ? `<span class="score-pill">${r.weighted_score_pct}% (A:${r.accurate_score} R:${r.relevant_score} O:${r.organized_score})</span>`
        : r.error ? `<span style="color:#dc3545;font-size:0.75rem;">error</span>` : `<span style="color:var(--text-muted);font-size:0.75rem;">no score</span>`;

      const dbIcon = r.db_saved ? '✅' : '❌';

      row.innerHTML = `
        <span>
          <strong>${r.id}</strong>
          <span class="status-badge badge-${r.type}" style="margin:0 0.4rem;">${r.type}</span>
          ${r.query.substring(0, 55)}${r.query.length > 55 ? '…' : ''}
        </span>
        <span style="display:flex;align-items:center;gap:0.5rem;">
          ${scoreText}
          <span class="elapsed">${(r.elapsed_ms/1000).toFixed(1)}s</span>
          <span class="db-badge" title="${r.db_saved ? 'Saved to DB' : (r.db_error || 'DB save failed')}">${dbIcon}</span>
        </span>
      `;
      container.appendChild(row);
    }

    function showSummary() {
      document.getElementById('progressSection').classList.add('hidden');
      document.getElementById('resultsSection').classList.remove('hidden');

      const scored = results.filter(r => r.weighted_score_pct != null);
      const avgScore = scored.length
        ? Math.round(scored.reduce((s, r) => s + r.weighted_score_pct, 0) / scored.length)
        : null;
      const avgMs = Math.round(results.reduce((s, r) => s + (r.elapsed_ms || 0), 0) / results.length);
      const dbSaved = results.filter(r => r.db_saved).length;

      document.getElementById('finalScore').textContent = avgScore != null ? `${avgScore}%` : '—';
      document.getElementById('finalPct').textContent = avgScore != null
        ? `average weighted score across ${scored.length} scored queries`
        : 'scoring unavailable';
      document.getElementById('finalMeta').textContent =
        `Model: ${currentModel} · Score model: ${currentScoreModel} · Avg time: ${(avgMs/1000).toFixed(1)}s`;
      document.getElementById('dbStatus').textContent =
        `💾 ${dbSaved}/${results.length} results saved to database`;
    }

    function copyResults() {
      const scored = results.filter(r => r.weighted_score_pct != null);
      const avg = scored.length
        ? Math.round(scored.reduce((s, r) => s + r.weighted_score_pct, 0) / scored.length)
        : null;
      const avgMs = Math.round(results.reduce((s, r) => s + (r.elapsed_ms || 0), 0) / results.length);
      let text = `A-002 Baseline Results\nModel: ${currentModel} | Score model: ${currentScoreModel}\nAvg weighted score: ${avg ?? '—'}%\nAvg time: ${(avgMs/1000).toFixed(1)}s\n\n`;
      results.forEach(r => {
        const score = r.weighted_score_pct != null ? `${r.weighted_score_pct}% (A:${r.accurate_score} R:${r.relevant_score} O:${r.organized_score})` : 'no score';
        text += `${r.id} [${r.type}] ${r.collection}\n  "${r.query}"\n  ${score} · ${(r.elapsed_ms/1000).toFixed(1)}s\n\n`;
      });
      navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
    }

    document.addEventListener('DOMContentLoaded', () => { loadModels(); });
  </script>
</body>
</html>
