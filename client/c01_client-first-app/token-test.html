<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Token Testing - AIPrivateSearch</title>
    <link rel="stylesheet" href="shared/styles.css">
    <script src="shared/utils/themeLoader.js"></script>
    <script src="csrf.js"></script>
    <script type="module" src="shared/common.js"></script>
    <style>
        .token-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .token-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .token-section h3 {
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        .token-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .token-key {
            font-weight: bold;
            color: var(--text-color);
        }
        
        .token-value {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-color);
            font-family: monospace;
        }
        
        .token-actions {
            display: flex;
            gap: 5px;
        }
        
        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .btn-update {
            background: #28a745;
            color: white;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-add {
            background: var(--primary);
            color: white;
            margin-top: 10px;
        }
        
        .add-form {
            display: none;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 4px;
        }
        
        .add-form.active {
            display: grid;
        }
        
        .raw-token {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .raw-token textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 12px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
        }
        
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .status-message {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
        }
        
        .status-success {
            border: 1px solid;
        }
        
        .status-error {
            border: 1px solid;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="page-content">
        <div class="token-container">
            <h1>App Token Testing & Management</h1>
            <p>Test and manage app_token values with full CRUD operations.</p>
            
            <div class="status-message" id="statusMessage"></div>
            
            <div class="actions-bar">
                <button class="btn btn-primary" onclick="refreshToken()">🔄 Refresh</button>
                <button class="btn btn-secondary" onclick="resetToken()">🔄 Reset to Default</button>
                <button class="btn btn-secondary" onclick="clearToken()">🗑️ Clear All</button>
                <button class="btn btn-secondary" onclick="exportToken()">📤 Export</button>
                <button class="btn btn-secondary" onclick="importToken()">📥 Import</button>
            </div>

            <!-- UI Section -->
            <div class="token-section">
                <h3>UI Preferences</h3>
                <div id="ui-section"></div>
                <button class="btn btn-add btn-small" onclick="showAddForm('ui')">+ Add UI Setting</button>
                <div class="add-form" id="ui-add-form">
                    <input type="text" id="ui-new-key" placeholder="Key name">
                    <input type="text" id="ui-new-value" placeholder="Value">
                    <button class="btn-small btn-update" onclick="addValue('ui')">Add</button>
                </div>
            </div>

            <!-- Search Section -->
            <div class="token-section">
                <h3>Search Settings</h3>
                <div id="search-section"></div>
                <button class="btn btn-add btn-small" onclick="showAddForm('search')">+ Add Search Setting</button>
                <div class="add-form" id="search-add-form">
                    <input type="text" id="search-new-key" placeholder="Key name">
                    <input type="text" id="search-new-value" placeholder="Value">
                    <button class="btn-small btn-update" onclick="addValue('search')">Add</button>
                </div>
            </div>

            <!-- Models Section -->
            <div class="token-section">
                <h3>Model Settings</h3>
                <div id="models-section"></div>
                <button class="btn btn-add btn-small" onclick="showAddForm('models')">+ Add Model Setting</button>
                <div class="add-form" id="models-add-form">
                    <input type="text" id="models-new-key" placeholder="Key name">
                    <input type="text" id="models-new-value" placeholder="Value">
                    <button class="btn-small btn-update" onclick="addValue('models')">Add</button>
                </div>
            </div>

            <!-- Session Section -->
            <div class="token-section">
                <h3>Session Info (Read-Only)</h3>
                <div id="session-section"></div>
                <p><small>Session data is managed by SecureUserManager and cannot be edited directly.</small></p>
            </div>

            <!-- Raw Token View -->
            <div class="raw-token">
                <h3>Raw Token (JSON)</h3>
                <textarea id="rawToken" readonly></textarea>
                <div style="margin-top: 10px;">
                    <button class="btn btn-secondary" onclick="copyToClipboard()">📋 Copy</button>
                    <button class="btn btn-secondary" onclick="validateToken()">✅ Validate</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        let currentToken = {};

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            refreshToken();
        });

        // Refresh token display
        function refreshToken() {
            if (!window.AppToken) {
                showStatus('AppToken not available', 'error');
                return;
            }
            
            currentToken = window.AppToken.getToken();
            renderSections();
            updateRawToken();
            showStatus('Token refreshed', 'success');
        }

        // Render all sections
        function renderSections() {
            renderSection('ui');
            renderSection('search');
            renderSection('models');
            renderSection('session');
        }

        // Render individual section
        function renderSection(sectionName) {
            const container = document.getElementById(`${sectionName}-section`);
            const sectionData = currentToken[sectionName] || {};
            
            container.innerHTML = '';
            
            Object.entries(sectionData).forEach(([key, value]) => {
                const row = document.createElement('div');
                row.className = 'token-grid';
                
                const isReadOnly = sectionName === 'session';
                const valueStr = typeof value === 'object' ? JSON.stringify(value) : String(value);
                
                row.innerHTML = `
                    <div class="token-key">${key}</div>
                    <input type="text" class="token-value" value="${valueStr}" 
                           ${isReadOnly ? 'readonly' : ''} 
                           onchange="updateValue('${sectionName}', '${key}', this.value)">
                    <div class="token-actions">
                        ${!isReadOnly ? `
                            <button class="btn-small btn-update" onclick="updateValue('${sectionName}', '${key}', this.previousElementSibling.value)">Update</button>
                            <button class="btn-small btn-delete" onclick="deleteValue('${sectionName}', '${key}')">Delete</button>
                        ` : '<span style="color: var(--text-muted); font-size: 12px;">Read-only</span>'}
                    </div>
                `;
                
                container.appendChild(row);
            });
        }

        // Update raw token display
        function updateRawToken() {
            document.getElementById('rawToken').value = JSON.stringify(currentToken, null, 2);
        }

        // CRUD Operations
        function updateValue(section, key, value) {
            try {
                // Try to parse as JSON, fallback to string
                let parsedValue;
                try {
                    parsedValue = JSON.parse(value);
                } catch {
                    parsedValue = value;
                }
                
                window.AppToken.set(section, key, parsedValue);
                refreshToken();
                showStatus(`Updated ${section}.${key}`, 'success');
            } catch (error) {
                showStatus(`Error updating ${section}.${key}: ${error.message}`, 'error');
            }
        }

        function deleteValue(section, key) {
            if (confirm(`Delete ${section}.${key}?`)) {
                try {
                    const sectionData = window.AppToken.getSection(section);
                    delete sectionData[key];
                    window.AppToken.setSection(section, sectionData);
                    refreshToken();
                    showStatus(`Deleted ${section}.${key}`, 'success');
                } catch (error) {
                    showStatus(`Error deleting ${section}.${key}: ${error.message}`, 'error');
                }
            }
        }

        function addValue(section) {
            const keyInput = document.getElementById(`${section}-new-key`);
            const valueInput = document.getElementById(`${section}-new-value`);
            
            const key = keyInput.value.trim();
            const value = valueInput.value.trim();
            
            if (!key) {
                showStatus('Key name is required', 'error');
                return;
            }
            
            try {
                // Try to parse as JSON, fallback to string
                let parsedValue;
                try {
                    parsedValue = JSON.parse(value);
                } catch {
                    parsedValue = value;
                }
                
                window.AppToken.set(section, key, parsedValue);
                keyInput.value = '';
                valueInput.value = '';
                hideAddForm(section);
                refreshToken();
                showStatus(`Added ${section}.${key}`, 'success');
            } catch (error) {
                showStatus(`Error adding ${section}.${key}: ${error.message}`, 'error');
            }
        }

        // UI Helpers
        function showAddForm(section) {
            document.getElementById(`${section}-add-form`).classList.add('active');
        }

        function hideAddForm(section) {
            document.getElementById(`${section}-add-form`).classList.remove('active');
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }

        // Token Management
        function resetToken() {
            if (confirm('Reset token to default values? This will clear all current settings.')) {
                window.AppToken.clear();
                refreshToken();
                showStatus('Token reset to defaults', 'success');
            }
        }

        function clearToken() {
            if (confirm('Clear all token data? This cannot be undone.')) {
                localStorage.removeItem('app_token');
                window.AppToken.initializeToken();
                refreshToken();
                showStatus('Token cleared', 'success');
            }
        }

        function exportToken() {
            const dataStr = JSON.stringify(currentToken, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'app_token_export.json';
            link.click();
            URL.revokeObjectURL(url);
            showStatus('Token exported', 'success');
        }

        function importToken() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const importedToken = JSON.parse(e.target.result);
                            window.AppToken.saveToken(importedToken);
                            refreshToken();
                            showStatus('Token imported successfully', 'success');
                        } catch (error) {
                            showStatus('Invalid JSON file', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function copyToClipboard() {
            const textarea = document.getElementById('rawToken');
            textarea.select();
            document.execCommand('copy');
            showStatus('Token copied to clipboard', 'success');
        }

        function validateToken() {
            try {
                JSON.parse(document.getElementById('rawToken').value);
                showStatus('Token is valid JSON', 'success');
            } catch (error) {
                showStatus('Invalid JSON: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
