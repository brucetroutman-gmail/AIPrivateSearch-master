<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modify Config Files - AIPrivateSearch</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="shared/license-checker.js"></script>
  <script src="shared/utils/apiConfig.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script>
    // Load theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (!savedTheme) {
        localStorage.setItem('theme', theme);
      }
    })();
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <main class="config-container">
    <h1>Configuration Files</h1>
    <p>Manage application configuration files.</p>
    
    <div class="config-section">
      <div class="config-header">
        <div class="config-title">Available Config Files</div>
        <button class="btn btn-warning" onclick="openConfigEditor('test.json')">Test Editor (test.json)</button>
      </div>
      <div id="fileGrid" class="file-grid">
        <!-- Files will be loaded dynamically -->
      </div>
    </div>
    </main>
  </div>

  <!-- Editor Modal -->
  <div id="editorModal" class="editor-modal">
    <div class="editor-modal-content">
      <div class="editor-modal-header">
        <h3 id="editorTitle">Edit File</h3>
        <button class="btn btn-danger" onclick="closeEditor()">✕</button>
      </div>
      <textarea id="editorTextarea" class="editor-textarea" placeholder="File content..."></textarea>
      <div class="editor-actions">
        <button class="btn btn-success" onclick="saveFile()">Save</button>
        <button class="btn btn-warning" onclick="closeEditor()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    async function loadConfigFiles() {
      console.log('=== loadConfigFiles() called ===');
      console.log('API_BASE_URL:', window.API_BASE_URL);
      try {
        const apiUrl = `${window.API_BASE_URL}/api/config/files`;
        console.log('Fetching config files from:', apiUrl);
        const response = await fetch(apiUrl);
        console.log('Response status:', response.status);
        const files = await response.json();
        console.log('Config files received:', files);
        
        const fileGrid = document.getElementById('fileGrid');
        const html = files.map(filename => `
          <div class="file-card">
            <div class="file-name">${filename}</div>
            <div class="file-actions">
              <button class="btn btn-primary" onclick="openConfigEditor('${filename}')">Edit</button>
            </div>
          </div>
        `).join('');
        console.log('Generated HTML:', html);
        fileGrid.innerHTML = html;
      } catch (error) {
        console.error('Failed to load config files:', error);
        document.getElementById('fileGrid').innerHTML = '<p>Error loading config files</p>';
      }
    }
    
    function openConfigEditor(filename) {
      console.log('openConfigEditor called with filename:', filename);
      // Store filename in sessionStorage as fallback
      sessionStorage.setItem('configFile', filename);
      console.log('Stored in sessionStorage:', sessionStorage.getItem('configFile'));
      const url = `config-editor.html?file=${filename}`;
      console.log('Navigating to URL:', url);
      console.log('Encoded filename:', encodeURIComponent(filename));
      window.location.href = url;
    }
    
    // Load files on page load
    document.addEventListener('DOMContentLoaded', loadConfigFiles);
  </script>
</body>
</html>
