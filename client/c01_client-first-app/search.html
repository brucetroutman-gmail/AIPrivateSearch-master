<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Private Search</title>
  <link rel="stylesheet" href="shared/styles.css?v=20241003">
  <script src="csrf.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script>
    // Load theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (!savedTheme) {
        localStorage.setItem('theme', theme);
      }
    })();
  </script>
  <script src="shared/license-checker.js"></script>
  <script type="module" src="shared/utils/tierAccessManager.js"></script>
  <script src="shared/utils/documentViewerCommon.js"></script>
  <script src="shared/utils/lineSearchFormatter.js"></script>
  <script src="shared/utils/queryProcessor.js"></script>
  <script src="shared/utils/documentSearchCommon.js"></script>
  <script src="shared/utils/documentIndexSearchCommon.js"></script>
  <script src="shared/utils/smartSearchCommon.js"></script>
  <script src="shared/utils/hybridSearchCommon.js"></script>
  <script src="shared/utils/responseDisplayCommon.js"></script>
  <script src="shared/utils/searchResultFormatter.js"></script>
  <script src="shared/utils/aiDirectCommon.js"></script>
  <script src="shared/utils/searchManager.js"></script>
  <script src="shared/utils/parameterManager.js"></script>
  <script type="module" src="shared/utils/domSanitizer.js"></script>
  <script src="shared/utils/highlightRenderer.js"></script>
  <script src="shared/utils/commonResultFormatter.js"></script>
  <style>
    h1 { margin-top: 0; }
    
    /* Layout Structure */
    .layout-container {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .form-column {
      min-width: 0;
    }
    
    .results-column {
      min-width: 0;
    }
    
    /* Form Groups */
    .form-group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }
    
    .form-group:hover {
      box-shadow: var(--shadow-md);
    }
    
    .form-group legend {
      font-weight: 700;
      color: var(--text-color);
      padding: 0 0.75rem;
      font-size: 1.125rem;
      letter-spacing: -0.01em;
    }
    
    /* Form Fields */
    .field {
      margin-bottom: 1.5rem;
    }
    
    .field:last-child {
      margin-bottom: 0;
    }
    
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.75rem;
      color: var(--text-color);
      font-size: 0.875rem;
    }
    
    select, textarea {
      width: 100%;
      padding: 0.875rem;
      background: var(--input-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 1rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    
    select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    textarea {
      height: 8rem;
      resize: vertical;
      line-height: 1.6;
    }
    
    /* Model Options Grid */
    .model-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    
    .option-group label {
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }
    
    .option-group select {
      font-size: 0.85rem;
      padding: 0.5rem;
    }
    
    /* Checkbox Group */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: 500;
      cursor: pointer;
    }
    
    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin-right: 0.5rem;
    }
    
    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }
    
    .submit-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    
    .submit-btn:active {
      transform: translateY(0);
    }
    
    .submit-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: var(--shadow);
    }
    
    /* Results */
    #output {
      white-space: pre-wrap;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
      min-height: 250px;
      box-shadow: var(--shadow);
      line-height: 1.6;
    }
    
    #output:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 1.125rem;
    }
    
    #output:empty::before {
      content: "Results will appear here...";
    }
    
    /* Tables */
    .score-table {
      border-collapse: collapse;
      margin-top: 1rem;
      width: 100%;
    }
    
    .score-table th, .score-table td {
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      text-align: center;
    }
    
    .score-table th {
      background: var(--card-bg);
      font-weight: 600;
    }
    
    /* Dark Theme */
    [data-theme="dark"] h3, [data-theme="dark"] h4 {
      color: #87ceeb;
    }
    
    [data-theme="dark"] .form-group legend {
      color: #87ceeb;
    }
    
    [data-theme="dark"] .score-table th, [data-theme="dark"] .score-table td {
      color: var(--text-color);
      background: var(--card-bg);
    }
    
    [data-theme="dark"] .score-table th {
      color: #87ceeb;
    }
    
    /* Search Highlighting */
    .search-highlight {
      background-color: yellow;
      color: black;
      padding: 0 2px;
      border-radius: 2px;
      font-weight: bold;
    }
    
    [data-theme="dark"] .search-highlight {
      background-color: #ffd700;
      color: #000;
    }
    
    /* Responsive Design */
    @media (max-width: 1024px) {
      .layout-container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .model-options {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      }
    }
    
    @media (max-width: 768px) {
      .form-group {
        padding: 1rem;
        margin-bottom: 1rem;
      }
      
      .model-options {
        grid-template-columns: 1fr;
      }
      
      .checkbox-group {
        gap: 0.5rem;
      }
      
      textarea {
        height: 6rem;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <h1>AI Private Search</h1>

    <div class="layout-container">
      <div class="form-column">
        <form id="searchForm">
          <!-- Source & Model Section -->
          <fieldset class="form-group">
            <legend>🔍 Source & Model</legend>
            <div class="field">
              <label for="sourceType">Source Type</label>
              <select id="sourceType">
                <option value="">Loading...</option>
              </select>
            </div>
            
            <div id="collectionSection" class="field hidden">
              <label for="collection">Collection</label>
              <select id="collection">
                <option value="">Loading collections...</option>
              </select>
            </div>
            
            <div id="searchTypeSection" class="field hidden">
              <label for="searchType">Search Type</label>
              <select id="searchType">
                <option value="">Loading search types...</option>
              </select>
            </div>
            
            <div id="wildcardSection" class="field hidden">
              <label class="checkbox-label">
                <input type="checkbox" id="useWildcards" />
                Use wildcards for substring matching
              </label>
            </div>
            

            
            <div class="field">
              <label for="model">Search Model</label>
              <select id="model" required>
                <option value="">Loading models...</option>
              </select>
            </div>
            
            <div class="model-options prem-only">
              <div class="option-group">
                <label for="temperature">Temperature</label>
                <select id="temperature">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group">
                <label for="context">Context</label>
                <select id="context">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group">
                <label for="tokens">Tokens</label>
                <select id="tokens">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Prompt Section -->
          <fieldset class="form-group">
            <legend>💬 Prompt</legend>
            <div class="field">
              <label for="assistantType">Assistant Type</label>
              <select id="assistantType">
                <option value="">Loading system prompts...</option>
              </select>
            </div>
            
            <div class="field">
              <label for="userPrompts">User Prompts</label>
              <select id="userPrompts">
                <option value="">Loading...</option>
              </select>
            </div>
            
            <div class="field">
              <label for="query">Enter your prompt</label>
              <textarea id="query" required placeholder="Ask me anything or select from User Prompts above…"></textarea>
            </div>
          </fieldset>

          <!-- Options & Actions Section -->
          <fieldset class="form-group">
            <legend>🎯 Options & Actions</legend>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="scoreToggle" />
                Generate scores
              </label>
              

              
              <label id="showChunksLabel" class="checkbox-label prem-only hidden">
                <input type="checkbox" id="showChunksToggle" />
                Show source chunks
              </label>
            </div>
          </fieldset>

          <!-- Scoring Section -->
          <fieldset id="scoringSection" class="form-group hidden">
            <legend>📊 Scoring</legend>
            <div class="field">
              <label for="scoreModel">Score Model</label>
              <select id="scoreModel">
                <option value="">Loading score models...</option>
              </select>
            </div>
            
            <div class="model-options prem-only">
              <div class="option-group prem-only">
                <label for="scoreTemperature">Temperature</label>
                <select id="scoreTemperature">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group prem-only">
                <label for="scoreContext">Context</label>
                <select id="scoreContext">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group prem-only">
                <label for="scoreTokens">Tokens</label>
                <select id="scoreTokens">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Submit Section -->
          <fieldset class="form-group">
            <legend>🚀 Execute</legend>
            <button type="submit" class="submit-btn">Submit</button>
          </fieldset>
        </form>
      </div>

      <div class="results-column">
        <section id="output"></section>
      </div>
    </div>



  </div>
  
  <div id="footer-placeholder"></div>
  <script type="module" src="./search.js"></script>
</body>
</html>
