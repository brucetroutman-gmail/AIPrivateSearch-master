<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Private Search</title>
  <link rel="stylesheet" href="shared/styles.css?v=20241003">
  <script src="csrf.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script>
    // Load theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (!savedTheme) {
        localStorage.setItem('theme', theme);
      }
    })();
  </script>
  <script src="shared/license-checker.js"></script>
  <script type="module" src="shared/utils/tierAccessManager.js"></script>
  <script src="shared/utils/documentViewerCommon.js"></script>
  <script src="shared/utils/lineSearchFormatter.js"></script>
  <script src="shared/utils/queryProcessor.js"></script>
  <script src="shared/utils/documentSearchCommon.js"></script>
  <script src="shared/utils/documentIndexSearchCommon.js"></script>
  <script src="shared/utils/smartSearchCommon.js"></script>
  <script src="shared/utils/hybridSearchCommon.js"></script>
  <script src="shared/utils/responseDisplayCommon.js"></script>
  <script src="shared/utils/searchResultFormatter.js"></script>
  <script src="shared/utils/aiDirectCommon.js"></script>
  <script src="shared/utils/searchManager.js"></script>
  <script src="shared/utils/parameterManager.js"></script>
  <script type="module" src="shared/utils/domSanitizer.js"></script>
  <script src="shared/utils/highlightRenderer.js"></script>
  <script src="shared/utils/commonResultFormatter.js"></script>
  <style>
    h1 { margin-top: 0; }
    
    /* Layout Structure */
    .layout-container {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .form-column {
      min-width: 0;
    }
    
    .results-column {
      min-width: 0;
    }
    
    /* Form Groups */
    .form-group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }
    
    .form-group:hover {
      box-shadow: var(--shadow-md);
    }
    
    .form-group legend {
      font-weight: 700;
      color: var(--text-color);
      padding: 0 0.75rem;
      font-size: 1.125rem;
      letter-spacing: -0.01em;
    }
    
    /* Form Fields */
    .field {
      margin-bottom: 1.5rem;
    }
    
    .field:last-child {
      margin-bottom: 0;
    }
    
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.75rem;
      color: var(--text-color);
      font-size: 0.875rem;
    }
    
    select, textarea {
      width: 100%;
      padding: 0.875rem;
      background: var(--input-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 1rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    
    select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    textarea {
      height: 8rem;
      resize: vertical;
      line-height: 1.6;
    }
    
    /* Model Options Grid */
    .model-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    
    .option-group label {
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }
    
    .option-group select {
      font-size: 0.85rem;
      padding: 0.5rem;
    }
    
    /* Checkbox Group */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: 500;
      cursor: pointer;
    }
    
    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin-right: 0.5rem;
    }
    
    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }
    
    .submit-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    
    .submit-btn:active {
      transform: translateY(0);
    }
    
    .submit-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: var(--shadow);
    }
    
    /* Results */
    #output {
      white-space: pre-wrap;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
      min-height: 250px;
      box-shadow: var(--shadow);
      line-height: 1.6;
    }
    
    #output:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 1.125rem;
    }
    
    #output:empty::before {
      content: "Results will appear here...";
    }
    
    /* Tables */
    .score-table {
      border-collapse: collapse;
      margin-top: 1rem;
      width: 100%;
    }
    
    .score-table th, .score-table td {
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      text-align: center;
    }
    
    .score-table th {
      background: var(--card-bg);
      font-weight: 600;
    }
    
    /* Dark Theme */
    [data-theme="dark"] h3, [data-theme="dark"] h4 {
      color: #87ceeb;
    }
    
    [data-theme="dark"] .form-group legend {
      color: #87ceeb;
    }
    
    [data-theme="dark"] .score-table th, [data-theme="dark"] .score-table td {
      color: var(--text-color);
      background: var(--card-bg);
    }
    
    [data-theme="dark"] .score-table th {
      color: #87ceeb;
    }
    
    /* Search Highlighting */
    .search-highlight {
      background-color: yellow;
      color: black;
      padding: 0 2px;
      border-radius: 2px;
      font-weight: bold;
    }
    
    [data-theme="dark"] .search-highlight {
      background-color: #ffd700;
      color: #000;
    }
    
    /* Responsive Design */
    @media (max-width: 1024px) {
      .layout-container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .model-options {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      }
    }
    
    @media (max-width: 768px) {
      .form-group {
        padding: 1rem;
        margin-bottom: 1rem;
      }
      
      .model-options {
        grid-template-columns: 1fr;
      }
      
      .checkbox-group {
        gap: 0.5rem;
      }
      
      textarea {
        height: 6rem;
      }
    }
    .btn-enhance {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-enhance:hover { opacity: 0.85; }
    .btn-enhance:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <h1>AI Private Search</h1>

    <div class="layout-container">
      <div class="form-column">
        <form id="searchForm">
          <!-- Source & Model Section -->
          <fieldset class="form-group">
            <legend>🔍 Source & Model</legend>
            <div class="field">
              <label for="sourceType">Source Type</label>
              <select id="sourceType">
                <option value="">Loading...</option>
              </select>
            </div>
            
            <div id="collectionSection" class="field hidden">
              <label for="collection">Collection</label>
              <select id="collection">
                <option value="">Loading collections...</option>
              </select>
            </div>
            
            <div id="searchTypeSection" class="field hidden">
              <label for="searchType">Search Type</label>
              <select id="searchType">
                <option value="">Loading search types...</option>
              </select>
            </div>
            

            
            <div class="field">
              <label for="model">Search Model</label>
              <select id="model" required>
                <option value="">Loading models...</option>
              </select>
            </div>
            
            <div class="model-options prem-only">
              <div class="option-group">
                <label for="temperature">Temperature</label>
                <select id="temperature">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group">
                <label for="context">Context</label>
                <select id="context">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group">
                <label for="tokens">Tokens</label>
                <select id="tokens">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Prompt Section -->
          <fieldset class="form-group">
            <legend>💬 Prompt</legend>
            <div class="field">
              <label for="assistantType">Assistant Type</label>
              <select id="assistantType">
                <option value="">Loading system prompts...</option>
              </select>
            </div>
            
            <div class="field">
              <label for="userPrompts">User Prompts</label>
              <select id="userPrompts">
                <option value="">Loading...</option>
              </select>
            </div>
            
            <div class="field">
              <label for="query">Enter your prompt</label>
              <textarea id="query" required placeholder="Ask me anything or select from User Prompts above…"></textarea>
              <button id="enhanceBtn" class="btn-enhance" style="display:none;" onclick="enhancePrompt()">✨ Enhance Prompt</button>
            </div>
          </fieldset>

          <!-- Options & Actions Section -->
          <fieldset class="form-group">
            <legend>🎯 Options & Actions</legend>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="scoreToggle" />
                Generate scores
              </label>
              

              
              <label id="showChunksLabel" class="checkbox-label prem-only hidden">
                <input type="checkbox" id="showChunksToggle" />
                Show source chunks
              </label>
            </div>
          </fieldset>

          <!-- Scoring Section -->
          <fieldset id="scoringSection" class="form-group hidden">
            <legend>📊 Scoring</legend>
            <div class="field">
              <label for="scoreModel">Score Model</label>
              <select id="scoreModel">
                <option value="">Loading score models...</option>
              </select>
            </div>
            
            <div class="model-options prem-only">
              <div class="option-group prem-only">
                <label for="scoreTemperature">Temperature</label>
                <select id="scoreTemperature">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group prem-only">
                <label for="scoreContext">Context</label>
                <select id="scoreContext">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group prem-only">
                <label for="scoreTokens">Tokens</label>
                <select id="scoreTokens">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Submit Section -->
          <fieldset class="form-group">
            <legend>🚀 Execute</legend>
            <button type="submit" class="submit-btn">Submit</button>
          </fieldset>
        </form>
      </div>

      <div class="results-column">
        <section id="output"></section>
      </div>
    </div>



  </div>
  
  <div id="footer-placeholder"></div>

  <!-- Enhance Prompt Modal -->
  <div id="enhanceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:var(--card-bg); border-radius:8px; padding:2rem; max-width:700px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow-lg);">
      <h3 style="margin-bottom:1rem; color:var(--text-color)">✨ Enhanced Prompt Preview</h3>
      <div style="margin-bottom:1rem;">
        <label style="font-weight:600; color:var(--text-muted); font-size:0.85rem;">ORIGINAL</label>
        <div id="originalPromptPreview" style="background:var(--input-bg); border:1px solid var(--border-color); border-radius:4px; padding:0.75rem; margin-top:0.25rem; color:var(--text-color); font-size:0.9rem;"></div>
      </div>
      <div style="margin-bottom:1.5rem;">
        <label style="font-weight:600; color:var(--primary); font-size:0.85rem;">ENHANCED</label>
        <div id="enhancedPromptPreview" style="background:var(--input-bg); border:1px solid var(--primary); border-radius:4px; padding:0.75rem; margin-top:0.25rem; color:var(--text-color); font-size:0.9rem; white-space:pre-wrap;"></div>
      </div>
      <div style="display:flex; gap:1rem; justify-content:flex-end;">
        <button onclick="cancelEnhance()" style="padding:0.6rem 1.2rem; border:1px solid var(--border-color); border-radius:4px; background:transparent; color:var(--text-color); cursor:pointer;">Cancel</button>
        <button onclick="useEnhanced()" style="padding:0.6rem 1.2rem; border:none; border-radius:4px; background:var(--primary); color:white; cursor:pointer; font-weight:600;">Use Enhanced</button>
      </div>
    </div>
  </div>

  <script type="module" src="./search.js"></script>
  <script>
    // Show/hide enhance button when collection is selected
    document.addEventListener('DOMContentLoaded', () => {
      const collectionSelect = document.getElementById('collection');
      const enhanceBtn = document.getElementById('enhanceBtn');
      if (collectionSelect && enhanceBtn) {
        collectionSelect.addEventListener('change', () => {
          enhanceBtn.style.display = collectionSelect.value ? 'inline-block' : 'none';
        });
      }
    });

    let pendingEnhanced = '';

    async function enhancePrompt() {
      const query = document.getElementById('query').value.trim();
      const collection = document.getElementById('collection').value;
      if (!query) { window.showUserMessage('Please enter a query first', 'error'); return; }
      if (!collection) { window.showUserMessage('Please select a collection first', 'error'); return; }

      const btn = document.getElementById('enhanceBtn');
      btn.textContent = 'Enhancing...';
      btn.disabled = true;

      try {
        const response = await fetch(`${window.API_BASE_URL}/api/fabric/enhance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('sessionId')}` },
          body: JSON.stringify({ query, collection })
        });
        const data = await response.json();
        if (!response.ok || !data.enhanced) throw new Error(data.error || 'Enhancement failed');

        pendingEnhanced = data.enhanced;
        document.getElementById('originalPromptPreview').textContent = query;
        document.getElementById('enhancedPromptPreview').textContent = data.enhanced;
        document.getElementById('enhanceModal').style.display = 'flex';
      } catch (err) {
        window.showUserMessage('Prompt enhancement unavailable — using original query', 'warning');
      } finally {
        btn.textContent = '✨ Enhance Prompt';
        btn.disabled = false;
      }
    }

    function useEnhanced() {
      document.getElementById('query').value = pendingEnhanced;
      document.getElementById('enhanceModal').style.display = 'none';
    }

    function cancelEnhance() {
      document.getElementById('enhanceModal').style.display = 'none';
    }
  </script>
</body>
</html>
