<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Private Search</title>
  <link rel="stylesheet" href="shared/styles.css?v=20241003">
  <script src="csrf.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script>
    // Load theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (!savedTheme) {
        localStorage.setItem('theme', theme);
      }
    })();
  </script>
  <script src="shared/license-checker.js"></script>
  <script type="module" src="shared/utils/tierAccessManager.js"></script>
  <script src="shared/utils/documentViewerCommon.js"></script>
  <script src="shared/utils/lineSearchFormatter.js"></script>
  <script src="shared/utils/queryProcessor.js"></script>
  <script src="shared/utils/documentSearchCommon.js"></script>
  <script src="shared/utils/documentIndexSearchCommon.js"></script>
  <script src="shared/utils/smartSearchCommon.js"></script>
  <script src="shared/utils/hybridSearchCommon.js"></script>
  <script src="shared/utils/responseDisplayCommon.js"></script>
  <script src="shared/utils/searchResultFormatter.js"></script>
  <script src="shared/utils/aiDirectCommon.js"></script>
  <script src="shared/utils/searchManager.js"></script>
  <script src="shared/utils/parameterManager.js"></script>
  <script type="module" src="shared/utils/domSanitizer.js"></script>
  <script src="shared/utils/highlightRenderer.js"></script>
  <script src="shared/utils/commonResultFormatter.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <h1>AI Private Search</h1>

    <div class="layout-container">
      <div class="form-column">
        <form id="searchForm">
          <!-- Search Mode Section -->
          <fieldset id="searchModeSection" class="form-group">
            <legend>🎯 Search Mode</legend>
            <div class="mode-toggle">
              <input type="radio" id="modeAuto" name="searchMode" value="auto" checked>
              <label for="modeAuto">
                <div class="mode-icon">🤖</div>
                <div class="mode-title">Auto</div>
                <div class="mode-desc">AI selects the best search method for your query</div>
              </label>
              
              <input type="radio" id="modeManual" name="searchMode" value="manual">
              <label for="modeManual">
                <div class="mode-icon">⚙️</div>
                <div class="mode-title">Advanced</div>
                <div class="mode-desc">Choose search method and parameters manually</div>
              </label>
            </div>
          </fieldset>

          <!-- Manual Controls Section (hidden in Auto mode) -->
          <div id="manualControlsSection">
          <!-- Source & Model Section -->
          <fieldset class="form-group">
            <legend>🔍 Source & Model</legend>
            <div class="field">
              <label for="sourceType">Source Type</label>
              <select id="sourceType">
                <option value="">Loading...</option>
              </select>
            </div>
            
            <div id="collectionSection" class="field hidden">
              <label for="collection">Collection</label>
              <select id="collection">
                <option value="">Loading collections...</option>
              </select>
            </div>
            
            <div id="searchTypeSection" class="field hidden">
              <label for="searchType">Search Type</label>
              <select id="searchType">
                <option value="">Loading search types...</option>
              </select>
            </div>
            

            
            <div class="field">
              <label for="model">Search Model</label>
              <select id="model" required>
                <option value="">Loading models...</option>
              </select>
            </div>
            
            <div class="model-options prem-only">
              <div class="option-group">
                <label for="temperature">Temperature</label>
                <select id="temperature">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group">
                <label for="context">Context</label>
                <select id="context">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group">
                <label for="tokens">Tokens</label>
                <select id="tokens">
                  <option value="">Loading...</option>
                </select>
              </div>

              <div class="option-group">
                <label for="topk">Top K</label>
                <select id="topk">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Prompt Section -->
          <fieldset class="form-group">
            <legend>💬 Prompt</legend>
            <!-- Assistant Type temporarily disabled (not wired to model); revisit later -->
            <div class="field hidden">
              <label for="assistantType">Assistant Type</label>
              <select id="assistantType">
                <option value="">Loading system prompts...</option>
              </select>
            </div>
            
            <div class="field">
              <label for="userPrompts">User Prompts</label>
              <select id="userPrompts">
                <option value="">Loading...</option>
              </select>
            </div>

            <div class="field">
              <label for="query">Enter your prompt</label>
              <textarea id="query" required placeholder="Ask me anything or select from User Prompts above…"></textarea>
            </div>

            <div class="field">
              <button id="enhanceBtn" class="btn-enhance hidden" onclick="enhancePrompt()">✨ Enhance Prompt</button>
            </div>

            <!-- Enhance Preview -->
            <div id="enhancePreview" class="enhance-preview hidden">
              <div class="enhance-preview-row">
                <label class="enhance-preview-label-original">ORIGINAL</label>
                <div id="originalPromptPreview" class="enhance-preview-original"></div>
              </div>
              <div class="enhance-preview-row-enhanced">
                <label class="enhance-preview-label-enhanced">ENHANCED</label>
                <div id="enhancedPromptPreview" class="enhance-preview-enhanced"></div>
              </div>
              <div class="enhance-preview-actions">
                <button onclick="cancelEnhance()" class="enhance-btn-cancel">Cancel</button>
                <button onclick="useEnhanced()" class="enhance-btn-use">Use This Prompt</button>
              </div>
            </div>
          </fieldset>

          <!-- Options & Actions Section -->
          <fieldset class="form-group">
            <legend>🎯 Options & Actions</legend>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="scoreToggle" />
                Generate scores
              </label>
              

              
              <label id="showChunksLabel" class="checkbox-label prem-only hidden">
                <input type="checkbox" id="showChunksToggle" />
                Show source chunks
              </label>
            </div>
          </fieldset>

          <!-- Scoring Section -->
          <fieldset id="scoringSection" class="form-group hidden">
            <legend>📊 Scoring</legend>
            <div class="field">
              <label for="scoreModel">Score Model</label>
              <select id="scoreModel">
                <option value="">Loading score models...</option>
              </select>
            </div>
            
            <div class="model-options prem-only">
              <div class="option-group prem-only">
                <label for="scoreTemperature">Temperature</label>
                <select id="scoreTemperature">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group prem-only">
                <label for="scoreContext">Context</label>
                <select id="scoreContext">
                  <option value="">Loading...</option>
                </select>
              </div>
              
              <div class="option-group prem-only">
                <label for="scoreTokens">Tokens</label>
                <select id="scoreTokens">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Submit Section -->
          <fieldset class="form-group">
            <legend>🚀 Execute</legend>
            <button type="submit" class="submit-btn">Submit</button>
          </fieldset>
          </div><!-- End manualControlsSection -->
        </form>
      </div>

      <div class="results-column">
        <!-- Smart Search Details (shown when intelligence layer used) -->
        <div id="smartSearchInfo" class="smart-search-details hidden">
          <div class="details-header">🧠 Smart Search Details</div>
          <div class="details-content">
            <p><span class="detail-label">Query Type:</span> <span id="detectedType"></span></p>
            <p><span class="detail-label">Search Method:</span> <span id="selectedMethod"></span></p>
            <p id="queryImprovedSection" class="hidden">
              <span class="detail-label">Query Improved:</span><br>
              <span class="detail-value" id="improvedQuery"></span>
            </p>
          </div>
        </div>

        <section id="output"></section>
      </div>
    </div>



  </div>
  <div id="footer-placeholder"></div>

  <script src="shared/utils/enhancePrompt.js"></script>
  <script type="module" src="./search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initEnhancePrompt('query', 'collection');
    });
  </script>
</body>
</html>
