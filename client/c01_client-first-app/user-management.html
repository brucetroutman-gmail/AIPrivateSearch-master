<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - AIPrivateSearch</title>
    <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main class="container">
        <h1>User Management</h1>
        
        <div class="auth-section">
            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <div style="margin-top: 10px; text-align: center;">
                    <button onclick="debugAdminAccount()" style="background: #6c757d; color: white; border: none; padding: 5px 10px; border-radius: 3px; font-size: 12px;">Debug Admin Account</button>
                    <button onclick="showDefaultCredentials()" style="background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 3px; font-size: 12px; margin-left: 5px;">Show Default Credentials</button>
                    <button onclick="clearSession()" style="background: #ffc107; color: black; border: none; padding: 5px 10px; border-radius: 3px; font-size: 12px; margin-left: 5px;">Clear Session</button>
                    <br><br>
                    <button onclick="createTestAdmin()" style="background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 3px; font-size: 12px;">Create Test Admin</button>
                </div>
            </div>
            
            <div id="register-form" class="auth-form" style="display: none;">
                <h2>Register New User</h2>
                <form id="registerForm">
                    <input type="email" id="registerEmail" placeholder="Email" required>
                    <input type="password" id="registerPassword" placeholder="Password" required>

                    <select id="registerUserRole">
                        <option value="searcher">Searcher</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>
        
        <div id="user-dashboard" style="display: none;">
            <div class="user-info">
                <h2>Welcome, <span id="currentUserEmail"></span></h2>
                <p>Subscription: <span id="currentUserSubscription"></span></p>
                <p>Role: <span id="currentUserRole"></span></p>
                <div style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center;">
                    <button onclick="window.location.href='/index.html'" style="background: #28a745;">Go to Application</button>
                    <button id="logoutBtn">Logout</button>
                </div>
            </div>
            
            <div class="license-info" style="margin: 20px 0; padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg);">
                <h3>License Information</h3>
                <div id="licenseStatus">Loading license status...</div>
                <div style="margin-top: 15px; text-align: center;">
                    <button id="refreshLicenseBtn" style="background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Refresh License</button>
                </div>
            </div>
            
            <div id="admin-panel" class="prem-only" style="display: none;">
                <h3>User Management</h3>
                <button id="showRegisterBtn">Add New User</button>
                <div id="users-list"></div>
            </div>
            
            <div id="user-profile" style="display: none;">
                <h3>My Profile</h3>
                <div class="profile-form">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="profileEmail">
                    </div>
                    <div class="form-group">
                        <label>New Password:</label>
                        <input type="password" id="profilePassword" placeholder="Leave blank to keep current password">
                    </div>
                    <div class="form-group">
                        <label>Subscription Tier:</label>
                        <span id="profileSubscription"></span>
                    </div>
                    <div class="form-group">
                        <label>Role:</label>
                        <span id="profileRole"></span>
                    </div>
                    <button id="updateProfileBtn">Update Profile</button>
                </div>
            </div>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>
    

    <script src="./shared/utils/apiConfig.js"></script>
    <script>
        // Load theme immediately to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            if (!savedTheme) {
                localStorage.setItem('theme', theme);
            }
        })();
        
        // Legacy function for compatibility
        function loadTheme() {
            // Theme already loaded above
        }
        
        // Load shared components
        async function loadSharedComponents() {
            try {
                const headerResponse = await fetch('./shared/header.html');
                const headerHTML = await headerResponse.text();
                const headerEl = document.getElementById('header-placeholder');
                if (headerEl) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(headerHTML, 'text/html');
                    const headerContent = doc.body.firstElementChild;
                    if (headerContent) {
                        headerEl.appendChild(headerContent);
                    }
                }
                
                const footerResponse = await fetch('./shared/footer.html');
                const footerHTML = await footerResponse.text();
                const footerEl = document.getElementById('footer-placeholder');
                if (footerEl) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(footerHTML, 'text/html');
                    const footerContent = doc.body.firstElementChild;
                    if (footerContent) {
                        footerEl.appendChild(footerContent);
                    }
                }
            } catch (error) {
                console.error('Error loading shared components:', error);
            }
        }
        
        function showMessage(message, type = 'error') {
            const messageEl = document.createElement('div');
            messageEl.className = `user-message ${type}`;
            messageEl.textContent = message;
            document.body.appendChild(messageEl);
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.parentNode.removeChild(messageEl);
                }
            }, 3000);
        }
        
        function securePrompt(message, defaultValue = '') {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
                
                const dialog = document.createElement('div');
                dialog.style.cssText = 'background:white;padding:20px;border-radius:8px;min-width:300px';
                
                const messageEl = document.createElement('p');
                messageEl.textContent = message;
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = defaultValue;
                input.style.cssText = 'width:100%;padding:8px;margin:10px 0;border:1px solid #ccc;border-radius:4px';
                
                const buttons = document.createElement('div');
                buttons.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;margin-top:15px';
                
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Cancel';
                cancelBtn.style.cssText = 'padding:8px 16px;border:1px solid #ccc;background:#f5f5f5;border-radius:4px;cursor:pointer';
                
                const okBtn = document.createElement('button');
                okBtn.textContent = 'OK';
                okBtn.style.cssText = 'padding:8px 16px;border:none;background:#007bff;color:white;border-radius:4px;cursor:pointer';
                
                cancelBtn.onclick = () => { document.body.removeChild(modal); resolve(null); };
                okBtn.onclick = () => { document.body.removeChild(modal); resolve(input.value); };
                
                buttons.appendChild(cancelBtn);
                buttons.appendChild(okBtn);
                dialog.appendChild(messageEl);
                dialog.appendChild(input);
                dialog.appendChild(buttons);
                modal.appendChild(dialog);
                document.body.appendChild(modal);
                
                input.focus();
                input.select();
            });
        }
        
        class AuthManager {
            constructor() {
                this.currentUser = null;
                this.init();
            }
            
            async init() {
                await this.checkAuthStatus();
                this.setupEventListeners();
            }
            
            async checkAuthStatus() {
                console.log('🔐 AUTH DEBUG: checkAuthStatus called');
                
                // Check for auto-fill credentials from license activation
                const autoFillEmail = localStorage.getItem('autoFillEmail');
                const autoFillPassword = localStorage.getItem('autoFillPassword');
                if (autoFillEmail && autoFillPassword) {
                    console.log('🔐 AUTH DEBUG: Auto-filling credentials from license activation');
                    document.getElementById('loginEmail').value = autoFillEmail;
                    document.getElementById('loginPassword').value = autoFillPassword;
                    // Clear the auto-fill data
                    localStorage.removeItem('autoFillEmail');
                    localStorage.removeItem('autoFillPassword');
                    showMessage('Credentials auto-filled from license activation. Click Login to continue.', 'info');
                }
                
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    console.log('🔐 AUTH DEBUG: SessionId from localStorage:', sessionId ? 'exists' : 'missing');
                    
                    if (!sessionId) {
                        console.log('🔐 AUTH DEBUG: No sessionId, showing login form');
                        this.showLogin();
                        return;
                    }
                    
                    const authUrl = `${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/me`;
                    console.log('🔐 AUTH DEBUG: Checking auth at:', authUrl);
                    
                    const response = await fetch(authUrl, {
                        headers: { 'Authorization': `Bearer ${sessionId}` }
                    });
                    
                    console.log('🔐 AUTH DEBUG: Auth check response status:', response.status);
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log('🔐 AUTH DEBUG: Auth check successful, user:', data.user);
                        this.currentUser = data.user;
                        // If user is authenticated, go directly to dashboard
                        this.showDashboard();
                    } else {
                        console.log('🔐 AUTH DEBUG: Auth check failed, showing login');
                        this.showLogin();
                    }
                } catch (error) {
                    console.log('🔐 AUTH DEBUG: Auth check error:', error);
                    this.showLogin();
                }
            }
            
            setupEventListeners() {
                document.getElementById('loginForm').addEventListener('submit', (e) => this.handleLogin(e));
                document.getElementById('registerForm').addEventListener('submit', (e) => this.handleRegister(e));
                document.getElementById('logoutBtn').addEventListener('click', () => this.handleLogout());
                document.getElementById('showRegisterBtn').addEventListener('click', () => this.toggleRegisterForm());
                document.getElementById('updateProfileBtn').addEventListener('click', () => this.updateProfile());
                document.getElementById('refreshLicenseBtn').addEventListener('click', () => this.refreshLicense());
            }
            
            async handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                console.log('🔐 LOGIN DEBUG: Login attempt started');
                console.log('🔐 LOGIN DEBUG: Email:', email);
                console.log('🔐 LOGIN DEBUG: Password length:', password.length);
                console.log('🔐 LOGIN DEBUG: API_BASE_URL:', window.API_BASE_URL);
                
                try {
                    const loginUrl = `${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/login`;
                    console.log('🔐 LOGIN DEBUG: Making request to:', loginUrl);
                    
                    const requestBody = { email, password };
                    console.log('🔐 LOGIN DEBUG: Request body:', requestBody);
                    
                    const response = await fetch(loginUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                    
                    console.log('🔐 LOGIN DEBUG: Response status:', response.status);
                    console.log('🔐 LOGIN DEBUG: Response headers:', Object.fromEntries(response.headers.entries()));
                    
                    const data = await response.json();
                    console.log('🔐 LOGIN DEBUG: Response data:', data);
                    
                    if (data.success) {
                        console.log('🔐 LOGIN DEBUG: Login successful, storing session');
                        localStorage.setItem('sessionId', data.sessionId);
                        this.currentUser = data.user;
                        console.log('🔐 LOGIN DEBUG: Redirecting to index.html');
                        window.location.href = '/index.html';
                    } else {
                        console.log('🔐 LOGIN DEBUG: Login failed:', data.error);
                        showMessage(data.error || 'Login failed');
                    }
                } catch (error) {
                    console.log('🔐 LOGIN DEBUG: Network error:', error);
                    showMessage('Login failed: ' + error.message);
                }
            }
            
            async handleRegister(e) {
                e.preventDefault();
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const userRole = document.getElementById('registerUserRole').value;
                
                try {
                    const { default: AuthUtils } = await import('./shared/utils/authUtils.js');
                    const response = await AuthUtils.authenticatedFetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, userRole })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        document.getElementById('registerForm').reset();
                        this.toggleRegisterForm();
                        this.loadUsers();
                    } else {
                        showMessage(data.error || 'Registration failed');
                    }
                } catch (error) {
                    if (error.message === 'Session expired') return;
                    showMessage('Registration failed');
                }
            }
            
            async handleLogout() {
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    if (sessionId) {
                        await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/logout`, { 
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${sessionId}` }
                        });
                    }
                    localStorage.removeItem('sessionId');
                    this.currentUser = null;
                    this.showLogin();
                } catch (error) {
                    showMessage('Logout failed');
                }
            }
            
            showLogin() {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('user-dashboard').style.display = 'none';
                document.getElementById('register-form').style.display = 'none';
            }
            
            showDashboard() {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('user-dashboard').style.display = 'block';
                document.getElementById('currentUserEmail').textContent = this.currentUser.email;
                document.getElementById('currentUserSubscription').textContent = this.currentUser.subscriptionTier;
                document.getElementById('currentUserRole').textContent = this.currentUser.userRole;
                
                // Load license info
                this.loadLicenseInfo();
                
                if (this.currentUser.userRole === 'admin') {
                    document.getElementById('admin-panel').style.display = 'block';
                    document.getElementById('user-profile').style.display = 'none';
                    this.loadUsers();
                } else {
                    document.getElementById('admin-panel').style.display = 'none';
                    document.getElementById('user-profile').style.display = 'block';
                    this.loadUserProfile();
                }
            }
            
            toggleRegisterForm() {
                const form = document.getElementById('register-form');
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
            }
            
            async loadUsers() {
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/users`, {
                        headers: { 'Authorization': `Bearer ${sessionId}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        this.displayUsers(data.users);
                    }
                } catch (error) {
                    console.error('Failed to load users:', error);
                }
            }
            
            displayUsers(users) {
                const container = document.getElementById('users-list');
                container.innerHTML = '';
                
                users.forEach(user => {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user-item';
                    const statusText = user.active ? 'Active' : 'Inactive';
                    userDiv.innerHTML = `
                        <span>${user.email} (${user.subscriptionTier}/${user.userRole}) - ${statusText}</span>
                        <select onchange="authManager.updateUserRole('${user.id}', this.value)">
                            <option value="searcher" ${user.userRole === 'searcher' ? 'selected' : ''}>Searcher</option>
                            <option value="admin" ${user.userRole === 'admin' ? 'selected' : ''}>Admin</option>
                        </select>
                        <button onclick="authManager.editUser('${user.id}', '${user.email}')" style="background: #007bff; color: white; border: none; padding: 4px 8px; margin: 0 2px;">
                            Edit
                        </button>
                        <button onclick="authManager.toggleUserStatus('${user.id}', ${!user.active})" style="background: ${user.active ? '#dc3545' : '#28a745'}; color: white; border: none; padding: 4px 8px; margin: 0 2px;">
                            ${user.active ? 'Deactivate' : 'Activate'}
                        </button>
                        <button onclick="authManager.deleteUser('${user.id}')" style="background: #dc3545; color: white; border: none; padding: 4px 8px; margin: 0 2px;">
                            Delete
                        </button>
                    `;
                    container.appendChild(userDiv);
                });
            }
            

            async updateUserRole(userId, userRole) {
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/users/${userId}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${sessionId}`
                        },
                        body: JSON.stringify({ userRole })
                    });
                    
                    if (response.ok) {
                        this.loadUsers();
                    } else {
                        showMessage('Failed to update role');
                    }
                } catch (error) {
                    showMessage('Update failed');
                }
            }
            
            async toggleUserStatus(userId, isActive) {
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/users/${userId}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${sessionId}`
                        },
                        body: JSON.stringify({ isActive })
                    });
                    
                    if (response.ok) {
                        showMessage(`User ${isActive ? 'activated' : 'deactivated'}`, 'success');
                        this.loadUsers();
                    } else {
                        showMessage('Failed to update user status');
                    }
                } catch (error) {
                    showMessage('Update failed');
                }
            }
            
            async deleteUser(userId) {
                if (!confirm('Are you sure you want to permanently delete this user?')) {
                    return;
                }
                
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/users/${userId}`, {
                        method: 'DELETE',
                        headers: { 
                            'Authorization': `Bearer ${sessionId}`
                        }
                    });
                    
                    if (response.ok) {
                        showMessage('User deleted successfully', 'success');
                        this.loadUsers();
                    } else {
                        showMessage('Failed to delete user');
                    }
                } catch (error) {
                    showMessage('Delete failed');
                }
            }
            
            async editUser(userId, currentEmail) {
                const newEmail = await securePrompt('Enter new email:', currentEmail);
                if (!newEmail || newEmail === currentEmail) return;
                
                const newPassword = await securePrompt('Enter new password (leave blank to keep current):', '');
                
                try {
                    const sessionId = localStorage.getItem('sessionId');
                    const updates = { email: newEmail };
                    if (newPassword) updates.password = newPassword;
                    
                    const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/users/${userId}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${sessionId}`
                        },
                        body: JSON.stringify(updates)
                    });
                    
                    if (response.ok) {
                        showMessage('User updated successfully', 'success');
                        this.loadUsers();
                    } else {
                        showMessage('Failed to update user');
                    }
                } catch (error) {
                    showMessage('Update failed');
                }
            }
            
            loadUserProfile() {
                document.getElementById('profileEmail').value = this.currentUser.email;
                document.getElementById('profileSubscription').textContent = this.currentUser.subscriptionTier;
                document.getElementById('profileRole').textContent = this.currentUser.userRole;
            }
            
            async updateProfile() {
                const email = document.getElementById('profileEmail').value;
                const password = document.getElementById('profilePassword').value;
                
                if (!email && !password) {
                    showMessage('Please enter email or password to update', 'error');
                    return;
                }
                
                try {
                    const updates = {};
                    if (email && email !== this.currentUser.email) updates.email = email;
                    if (password) updates.password = password;
                    
                    if (Object.keys(updates).length === 0) {
                        showMessage('No changes to update', 'info');
                        return;
                    }
                    
                    const { default: AuthUtils } = await import('./shared/utils/authUtils.js');
                    const response = await AuthUtils.authenticatedFetch(`/api/auth/users/${this.currentUser.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updates)
                    });
                    
                    if (response.ok) {
                        showMessage('Profile updated successfully', 'success');
                        document.getElementById('profilePassword').value = '';
                        if (updates.email) {
                            this.currentUser.email = updates.email;
                            localStorage.setItem('userEmail', updates.email);
                        }
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        showMessage(`Failed to update profile: ${errorData.error || response.status}`);
                    }
                } catch (error) {
                    if (error.message === 'Session expired') return;
                    showMessage('Update failed');
                }
            }
            
            async loadLicenseInfo() {
                try {
                    // Get stored license email for device validation
                    const licenseEmail = localStorage.getItem('licenseEmail') || localStorage.getItem('userEmail');
                    const url = licenseEmail ? 
                        `${window.API_BASE_URL || 'http://localhost:3001'}/api/licensing/status?email=${encodeURIComponent(licenseEmail)}` :
                        `${window.API_BASE_URL || 'http://localhost:3001'}/api/licensing/status`;
                    
                    const response = await fetch(url);
                    const status = await response.json();
                    this.displayLicenseInfo(status);
                } catch (error) {
                    document.getElementById('licenseStatus').innerHTML = `
                        <div style="color: #dc3545;">Failed to load license information</div>
                    `;
                }
            }
            
            displayLicenseInfo(status) {
                const container = document.getElementById('licenseStatus');
                
                if (status.valid) {
                    const tierName = status.tier === 1 ? 'Standard' : 
                                   status.tier === 2 ? 'Premium' : 'Professional';
                    
                    container.innerHTML = `
                        <div style="color: #28a745; margin-bottom: 10px;"><strong>✓ License Active</strong></div>
                        <div><strong>Tier:</strong> ${tierName}</div>
                        <div><strong>Email:</strong> ${status.email}</div>
                        ${status.gracePeriod ? '<div style="color: #ffc107;"><em>Grace period active</em></div>' : ''}
                        ${status.expired ? '<div style="color: #ffc107;"><em>License expired but within grace period</em></div>' : ''}
                    `;
                } else {
                    container.innerHTML = `
                        <div style="color: #dc3545; margin-bottom: 10px;"><strong>⚠ License Issue</strong></div>
                        <div><strong>Status:</strong> ${status.reason || 'Invalid license'}</div>
                        ${status.requiresActivation ? '<div><a href="license-activation.html" style="color: #007bff;">Activate License</a></div>' : ''}
                    `;
                }
            }
            
            async refreshLicense() {
                const btn = document.getElementById('refreshLicenseBtn');
                const originalText = btn.textContent;
                
                try {
                    btn.textContent = 'Refreshing...';
                    btn.disabled = true;
                    
                    const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/licensing/refresh`, {
                        method: 'POST'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        showMessage('License refreshed successfully', 'success');
                        // Reload license info to show updated status
                        await this.loadLicenseInfo();
                    } else {
                        showMessage(result.error || 'Failed to refresh license', 'error');
                    }
                } catch (error) {
                    showMessage('Failed to refresh license', 'error');
                } finally {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            }
        }
        
        // Debug function to show default credentials
        function showDefaultCredentials() {
            console.log('🔐 CREDS DEBUG: Default admin credentials');
            console.log('🔐 CREDS DEBUG: Email: adm-std@a.com');
            console.log('🔐 CREDS DEBUG: Password: 123 (3 characters)');
            
            // Auto-fill the form with default credentials
            document.getElementById('loginEmail').value = 'adm-std@a.com';
            document.getElementById('loginPassword').value = '123';
            
            showMessage('Default credentials filled: adm-std@a.com / 123', 'info');
        }
        
        // Function to create admin account for testing
        async function createTestAdmin() {
            console.log('🔐 CREATE DEBUG: Creating test admin account');
            try {
                const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/create-test-admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'adm-std@a.com',
                        password: '123',
                        userRole: 'admin',
                        subscriptionTier: 'professional'
                    })
                });
                const data = await response.json();
                console.log('🔐 CREATE DEBUG: Create admin result:', data);
                
                if (data.success) {
                    showMessage('Test admin account created successfully!', 'success');
                } else {
                    showMessage('Failed to create admin: ' + (data.error || 'Unknown error'), 'error');
                }
                
                return data;
            } catch (error) {
                console.log('🔐 CREATE DEBUG: Error creating admin account:', error);
                showMessage('Error creating admin account: ' + error.message, 'error');
                return null;
            }
        }
        
        // Make function available globally
        window.createTestAdmin = createTestAdmin;
        
        // Make function available globally
        window.showDefaultCredentials = showDefaultCredentials;
        
        // Debug function to check admin account
        async function debugAdminAccount() {
            console.log('🔐 ADMIN DEBUG: Checking admin account status');
            try {
                // First check if users.json exists and what's in it
                const response = await fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/debug-users`, {
                    method: 'GET'
                });
                const data = await response.json();
                console.log('🔐 ADMIN DEBUG: Users file content:', data);
                
                // Show in UI
                const message = `Users found: ${data.users ? data.users.length : 0}\n` +
                               `Admin account exists: ${data.users && data.users.find(u => u.email === 'adm-std@a.com') ? 'YES' : 'NO'}\n` +
                               `File path: ${data.filePath || 'unknown'}\n` +
                               `Check console for full details`;
                showMessage(message, 'info');
                
                return data;
            } catch (error) {
                console.log('🔐 ADMIN DEBUG: Error checking admin account:', error);
                showMessage('Error checking admin account: ' + error.message, 'error');
                return null;
            }
        }
        
        // Make debug function available globally
        window.debugAdminAccount = debugAdminAccount;
        
        // Simple logout function for testing
        function testLogout() {
            if (confirm('Logout for testing?')) {
                const sessionId = localStorage.getItem('sessionId');
                if (sessionId) {
                    fetch(`${window.API_BASE_URL || 'http://localhost:3001'}/api/auth/logout`, { 
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${sessionId}` }
                    });
                }
                localStorage.removeItem('sessionId');
                localStorage.removeItem('userEmail');
                window.location.reload();
            }
        }
        
        // Make testLogout globally available
        window.testLogout = testLogout;
        
        // Function to clear invalid session
        function clearSession() {
            console.log('🔐 SESSION DEBUG: Clearing session from localStorage');
            localStorage.removeItem('sessionId');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userUserRole');
            showMessage('Session cleared. Please login again.', 'info');
            window.location.reload();
        }
        
        // Make clearSession globally available
        window.clearSession = clearSession;
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async function() {
            // Theme already loaded in head
            
            // Check authentication first
            try {
                const { default: AuthUtils } = await import('./shared/utils/authUtils.js');
                const user = await AuthUtils.checkAuth();
                if (user) {
                    // Store user data for compatibility
                    localStorage.setItem('userRole', user.subscriptionTier);
                    localStorage.setItem('userUserRole', user.userRole);
                    localStorage.setItem('userEmail', user.email);
                }
            } catch (error) {
                console.warn('Auth check failed:', error);
            }
            
            loadSharedComponents();
        });
        
        const authManager = new AuthManager();
    </script>
