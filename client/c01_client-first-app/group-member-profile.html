<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Member Profile - AIPrivateSearch</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script type="module" src="shared/common.js"></script>
  <script>
    // Load theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (!savedTheme) {
        localStorage.setItem('theme', theme);
      }
    })();
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <main class="profile-container">
      <div id="loading" class="loading">Loading member profile...</div>
      <div id="error" class="error hidden">Failed to load member profile.</div>
      <div id="profile-content" class="hidden"></div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || 'bruce.troutman@gmail.com';
      
      try {
        const response = await fetch(`https://iodd.com/api2/members?email=${email}`);
        if (!response.ok) {
          throw new Error('Failed to fetch member data');
        }
        
        const memberData = await response.json();
        console.log('Member data received:', memberData);
        // Extract the first member from the members array
        const member = memberData.members && memberData.members[0] ? memberData.members[0] : memberData;
        displayProfile(member);
      } catch (error) {
        console.error('Error loading member profile:', error);
        showError('Failed to load member profile');
      }
    });
    
    function displayProfile(data) {
      console.log('Displaying profile for data:', data);
      const loading = document.getElementById('loading');
      const profileContent = document.getElementById('profile-content');
      
      loading.style.display = 'none';
      profileContent.classList.remove('hidden');
      
      profileContent.innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <h1 class="profile-name">${data.TitleName || ''} ${data.FirstName || ''} ${data.LastName || ''}</h1>
            <div class="profile-email">${data.Email || ''}</div>
          </div>
          
          <div class="profile-section">
            <h3>Contact Information</h3>
            <div class="profile-info">
              ${data.Company ? `<div class="info-item"><div class="info-label">Company</div><div class="info-value">${data.Company}</div></div>` : ''}
              ${data.Phone1 ? `<div class="info-item"><div class="info-label">Phone</div><div class="info-value">${data.Phone1}</div></div>` : ''}
              ${data.Phone2 ? `<div class="info-item"><div class="info-label">Phone 2</div><div class="info-value">${data.Phone2}</div></div>` : ''}
              ${data.WebSite ? `<div class="info-item"><div class="info-label">Website</div><div class="info-value"><a href="${data.WebSite}" target="_blank">${data.WebSite}</a></div></div>` : ''}
            </div>
          </div>
          
          ${data.Address1 || data.City || data.State ? `
          <div class="profile-section">
            <h3>Address</h3>
            <div class="profile-info">
              ${data.Address1 ? `<div class="info-item"><div class="info-label">Address</div><div class="info-value">${data.Address1}</div></div>` : ''}
              ${data.Address2 ? `<div class="info-item"><div class="info-label">Address 2</div><div class="info-value">${data.Address2}</div></div>` : ''}
              ${data.City ? `<div class="info-item"><div class="info-label">City</div><div class="info-value">${data.City}</div></div>` : ''}
              ${data.State ? `<div class="info-item"><div class="info-label">State</div><div class="info-value">${data.State}</div></div>` : ''}
              ${data.Zip ? `<div class="info-item"><div class="info-label">Zip</div><div class="info-value">${data.Zip}</div></div>` : ''}
              ${data.Country ? `<div class="info-item"><div class="info-label">Country</div><div class="info-value">${data.Country}</div></div>` : ''}
            </div>
          </div>
          ` : ''}
          
          <div class="profile-section">
            <h3>Debug Info</h3>
            <pre class="profile-debug-pre">${JSON.stringify(data, null, 2)}</pre>
          </div>
        </div>
      `;
    }
    
    function showError(message) {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      
      loading.style.display = 'none';
      error.classList.remove('hidden');
      error.textContent = message;
    }
  </script>
</body>
</html>
