<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Collections — AIPrivateSearch</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="./shared/utils/apiConfig.js"></script>
  <script src="shared/license-checker.js"></script>
  <script src="csrf.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      if (!localStorage.getItem('theme')) localStorage.setItem('theme', t);
    })();
  </script>
  <style>
    .section { margin: 20px 0; border: 1px solid var(--border-color); padding: 15px; border-radius: 5px; background: var(--card-bg); }
    .section-header { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    .test-item { margin: 4px 0; padding: 4px 0; }
    .test-code { font-family: monospace; font-weight: bold; color: #0066cc; }
    [data-theme="dark"] .test-code { color: #64b5f6; }
    .controls { margin: 20px 0; padding: 15px; background: var(--card-bg); border-radius: 5px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .execute-btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95rem; }
    .execute-btn:hover { background: #0056b3; }
    .execute-btn:disabled { background: #ccc; cursor: not-allowed; }
    .model-selector { margin: 15px 0; padding: 15px; background: var(--card-bg); border-radius: 5px; border: 1px solid var(--border-color); }
    .model-label { font-weight: bold; margin-bottom: 8px; }
    .model-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .model-list label { padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.85rem; cursor: pointer; }
    .score-model-select { padding: 0.4rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--input-bg); color: var(--text-color); min-width: 200px; }
    .progress-bar-wrap { background: var(--border-color); border-radius: 4px; height: 8px; margin: 0.5rem 0; }
    .progress-bar { background: var(--primary); height: 8px; border-radius: 4px; transition: width 0.3s; }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
    .score-pill { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: var(--input-bg); }
    .elapsed { font-size: 0.75rem; color: var(--text-muted); }
    .db-badge { font-size: 0.7rem; color: var(--text-muted); }
    .badge-fact { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #e3f2fd; color: #1565c0; }
    .badge-analysis { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #f3e5f5; color: #6a1b9a; }
    .badge-creative { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #e8f5e9; color: #2e7d32; }
    [data-theme="dark"] .badge-fact { background: #1a3a5c; color: #90caf9; }
    [data-theme="dark"] .badge-analysis { background: #3a1a5c; color: #ce93d8; }
    [data-theme="dark"] .badge-creative { background: #1a3a1a; color: #a5d6a7; }
    .score-card { background: var(--card-bg); border: 2px solid var(--primary); border-radius: 8px; padding: 1.5rem; text-align: center; margin-top: 1rem; }
    .score-number { font-size: 2.5rem; font-weight: 700; color: var(--primary); }
    .hidden { display: none !important; }
    .running-indicator { display: inline-block; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <h1>Test Collections</h1>
    <p style="color:var(--text-muted);margin-top:-0.5rem;">Run A-002 collection queries with AI scoring. Results saved to MySQL.</p>

    <!-- Search Models -->
    <div class="model-selector">
      <div class="model-label">Search Model:</div>
      <label><input type="checkbox" id="selectAllModels"> Select All</label>
      <div id="modelList" class="model-list">Loading models...</div>
    </div>

    <!-- Score Model -->
    <div class="model-selector">
      <div class="model-label">Score Model:</div>
      <select id="scoreModelSelect" class="score-model-select"><option value="">Loading...</option></select>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label><input type="checkbox" id="selectAll"> Select All Tests</label>
      <button class="execute-btn" onclick="executeSelected()">▶ Execute Selected Tests</button>
      <span id="selectedCount" style="font-size:0.85rem;color:var(--text-muted);">0 tests selected</span>
    </div>

    <!-- A-002 Test List -->
    <div class="section">
      <div class="section-header">
        <label><input type="checkbox" id="selectMedical"> Sample_Medical-Practice (5 queries)</label>
      </div>
      <div id="tests-medical"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <label><input type="checkbox" id="selectLaw"> Sample_Law-Office (3 queries)</label>
      </div>
      <div id="tests-law"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <label><input type="checkbox" id="selectFederalist"> Sample_Federalist-Papers (3 queries)</label>
      </div>
      <div id="tests-federalist"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <label><input type="checkbox" id="selectEmails"> Sample_My-Emails (4 queries)</label>
      </div>
      <div id="tests-emails"></div>
    </div>

    <!-- Progress -->
    <div id="progressSection" class="hidden" style="margin:1rem 0;">
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-muted);">
        <span id="progressLabel">Running...</span>
        <span id="scoreLabel">Avg score: —</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      <div id="currentQueryInfo" style="font-size:0.85rem;color:var(--text-muted);margin-top:0.25rem;"></div>
    </div>

    <!-- Live results -->
    <div id="liveResults"></div>

    <!-- Summary -->
    <div id="summarySection" class="hidden">
      <div class="score-card">
        <div class="score-number" id="finalScore">—</div>
        <div style="color:var(--text-muted);font-size:0.9rem;" id="finalPct"></div>
        <div style="margin-top:0.5rem;font-size:0.85rem;color:var(--text-muted);" id="finalMeta"></div>
        <div style="font-size:0.8rem;margin-top:0.25rem;" id="dbStatus"></div>
      </div>
      <div style="margin-top:1rem;display:flex;gap:1rem;">
        <button class="execute-btn" onclick="copyResults()" style="background:#17a2b8;">📋 Copy Results</button>
        <button class="execute-btn" onclick="location.reload()" style="background:#6c757d;">↺ Run Again</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { exportToDatabase, loadScoreModels } from './shared/common.js';
    import { search } from './services/api.js';

    const TESTS = [
      { id:'M1', testCode:'t27711115451', collection:'Sample_Medical-Practice', type:'fact',     query:'Find patients with diabetes',                                                       promptPos:1, temperature:0.1, contextSize:16384, tokenLimit:4096, topK:20 },
      { id:'M2', testCode:'t27712115451', collection:'Sample_Medical-Practice', type:'fact',     query:'What medications is William Adams taking?',                                         promptPos:2, temperature:0.1, contextSize:16384, tokenLimit:4096, topK:20 },
      { id:'M3', testCode:'t27713115451', collection:'Sample_Medical-Practice', type:'fact',     query:'Find all patients with cancer',                                                     promptPos:3, temperature:0.1, contextSize:16384, tokenLimit:4096, topK:20 },
      { id:'M4', testCode:'t27714115451', collection:'Sample_Medical-Practice', type:'analysis', query:'Compare treatment approaches for hip vs knee replacement patients',                 promptPos:4, temperature:0.1, contextSize:16384, tokenLimit:4096, topK:20 },
      { id:'M5', testCode:'t27715115451', collection:'Sample_Medical-Practice', type:'creative', query:'Summarize the types of conditions treated at this practice',                        promptPos:5, temperature:0.1, contextSize:16384, tokenLimit:4096, topK:20 },
      { id:'L1', testCode:'t27611114321', collection:'Sample_Law-Office',        type:'fact',     query:'Which clients have durable power of attorney documents?',                           promptPos:1, temperature:0.1, contextSize:8192,  tokenLimit:1024, topK:10 },
      { id:'L2', testCode:'t27612114321', collection:'Sample_Law-Office',        type:'fact',     query:'Show upcoming appointments',                                                        promptPos:2, temperature:0.1, contextSize:8192,  tokenLimit:1024, topK:10 },
      { id:'L3', testCode:'t27613114321', collection:'Sample_Law-Office',        type:'analysis', query:'What are the most common types of estate planning documents in this collection?',  promptPos:3, temperature:0.1, contextSize:8192,  tokenLimit:1024, topK:10 },
      { id:'F1', testCode:'t27411135461', collection:'Sample_Federalist-Papers', type:'fact',     query:'What arguments does Hamilton make for a strong central government?',                promptPos:1, temperature:0.3, contextSize:16384, tokenLimit:2048, topK:30 },
      { id:'F2', testCode:'t27412135461', collection:'Sample_Federalist-Papers', type:'analysis', query:'Compare the arguments for Union vs arguments against it in these papers',          promptPos:2, temperature:0.3, contextSize:16384, tokenLimit:2048, topK:30 },
      { id:'F3', testCode:'t27413135461', collection:'Sample_Federalist-Papers', type:'creative', query:'Summarize the main themes of the Federalist Papers',                              promptPos:3, temperature:0.3, contextSize:16384, tokenLimit:2048, topK:30 },
      { id:'E1', testCode:'t27811113351', collection:'Sample_My-Emails',         type:'fact',     query:'Find emails about parts orders',                                                    promptPos:1, temperature:0.1, contextSize:4096,  tokenLimit:1024, topK:25 },
      { id:'E2', testCode:'t27812113351', collection:'Sample_My-Emails',         type:'fact',     query:'What parts were ordered from the supplier?',                                       promptPos:2, temperature:0.1, contextSize:4096,  tokenLimit:1024, topK:25 },
      { id:'E3', testCode:'t27813113351', collection:'Sample_My-Emails',         type:'analysis', query:'What is the main business relationship described in these emails?',                promptPos:3, temperature:0.1, contextSize:4096,  tokenLimit:1024, topK:25 },
      { id:'E4', testCode:'t27814113351', collection:'Sample_My-Emails',         type:'fact',     query:'Find emails about monthly reports',                                                 promptPos:4, temperature:0.1, contextSize:4096,  tokenLimit:1024, topK:25 },
    ];

    const GROUPS = {
      medical:    { selector: 'selectMedical',    container: 'tests-medical',    ids: ['M1','M2','M3','M4','M5'] },
      law:        { selector: 'selectLaw',         container: 'tests-law',        ids: ['L1','L2','L3'] },
      federalist: { selector: 'selectFederalist',  container: 'tests-federalist', ids: ['F1','F2','F3'] },
      emails:     { selector: 'selectEmails',      container: 'tests-emails',     ids: ['E1','E2','E3','E4'] },
    };

    let allResults = [];
    let isProcessing = false;

    // ── Render test checkboxes ──────────────────────────────────────────────
    function renderTests() {
      TESTS.forEach(t => {
        const groupKey = Object.keys(GROUPS).find(k => GROUPS[k].ids.includes(t.id));
        const container = document.getElementById(GROUPS[groupKey].container);
        const item = document.createElement('div');
        item.className = 'test-item';
        item.innerHTML = `
          <label>
            <input type="checkbox" class="test-checkbox" data-id="${t.id}">
            <span class="test-code">${t.testCode}</span>
            <span class="badge-${t.type}" style="margin:0 0.4rem;">${t.type}</span>
            <strong>${t.id}</strong> — ${t.query}
          </label>`;
        container.appendChild(item);
      });
    }

    // ── Checkbox wiring ─────────────────────────────────────────────────────
    function setupCheckboxes() {
      document.getElementById('selectAll').addEventListener('change', function() {
        document.querySelectorAll('.test-checkbox').forEach(cb => cb.checked = this.checked);
        updateCount();
      });

      Object.values(GROUPS).forEach(g => {
        document.getElementById(g.selector).addEventListener('change', function() {
          g.ids.forEach(id => {
            const cb = document.querySelector(`.test-checkbox[data-id="${id}"]`);
            if (cb) cb.checked = this.checked;
          });
          updateCount();
        });
      });

      document.addEventListener('change', e => {
        if (e.target.classList.contains('test-checkbox')) updateCount();
      });
    }

    function updateCount() {
      const n = document.querySelectorAll('.test-checkbox:checked').length;
      document.getElementById('selectedCount').textContent = `${n} test${n !== 1 ? 's' : ''} selected`;
    }

    // ── Load models ──────────────────────────────────────────────────────────
    async function loadModels() {
      try {
        const r = await fetch(`${window.API_BASE_URL}/api/config/models-list.json`);
        const d = await r.json();
        const searchModels = d.models.filter(m => m.category === 'search');
        const allModels = d.models;

        const list = document.getElementById('modelList');
        list.innerHTML = '';
        searchModels.forEach(m => {
          const lbl = document.createElement('label');
          lbl.innerHTML = `<input type="checkbox" class="model-checkbox" value="${m.modelName}"> ${m.modelName}`;
          list.appendChild(lbl);
        });

        document.getElementById('selectAllModels').addEventListener('change', function() {
          document.querySelectorAll('.model-checkbox').forEach(cb => cb.checked = this.checked);
        });

        await loadScoreModels('scoreModelSelect');
      } catch(e) { console.error('Failed to load models', e); }
    }

    // ── Execute ──────────────────────────────────────────────────────────────
    window.executeSelected = async function() {
      if (isProcessing) return;

      const selectedIds = Array.from(document.querySelectorAll('.test-checkbox:checked')).map(cb => cb.dataset.id);
      const selectedModels = Array.from(document.querySelectorAll('.model-checkbox:checked')).map(cb => cb.value);
      const scoreModel = document.getElementById('scoreModelSelect').value;

      if (!selectedIds.length)   { alert('Please select at least one test.'); return; }
      if (!selectedModels.length){ alert('Please select at least one search model.'); return; }
      if (!scoreModel)           { alert('Please select a score model.'); return; }

      isProcessing = true;
      setUIState(true);
      allResults = [];
      document.getElementById('liveResults').innerHTML = '';
      document.getElementById('summarySection').classList.add('hidden');
      document.getElementById('progressSection').classList.remove('hidden');

      const queue = [];
      selectedIds.forEach(id => selectedModels.forEach(model => queue.push({ test: TESTS.find(t => t.id === id), model })));
      const total = queue.length;

      for (let i = 0; i < queue.length; i++) {
        const { test, model } = queue[i];
        updateProgress(i, total, test, model);
        const result = await runQuery(test, model, scoreModel);
        allResults.push(result);
        renderResultRow(result);
        updateAvgScore();
        if (i < queue.length - 1) await new Promise(r => setTimeout(r, 1000));
      }

      document.getElementById('progressSection').classList.add('hidden');
      showSummary(selectedModels);
      setUIState(false);
      isProcessing = false;
    };

    function setUIState(processing) {
      document.querySelector('.execute-btn').disabled = processing;
      document.querySelectorAll('.model-checkbox, .test-checkbox, #selectAll, #selectAllModels, #selectMedical, #selectLaw, #selectFederalist, #selectEmails, #scoreModelSelect').forEach(el => el.disabled = processing);
    }

    function updateProgress(i, total, test, model) {
      document.getElementById('progressLabel').textContent = `Running ${i + 1} of ${total}...`;
      document.getElementById('progressBar').style.width = `${(i / total) * 100}%`;
      document.getElementById('currentQueryInfo').innerHTML =
        `<span class="running-indicator">⏳</span> <strong>${test.id}</strong> [${model}] — ${test.query}`;
    }

    function updateAvgScore() {
      const scored = allResults.filter(r => r.weighted_score_pct != null);
      if (!scored.length) { document.getElementById('scoreLabel').textContent = 'Avg score: —'; return; }
      const avg = Math.round(scored.reduce((s, r) => s + r.weighted_score_pct, 0) / scored.length);
      document.getElementById('scoreLabel').textContent = `Avg score: ${avg}%`;
    }

    async function runQuery(test, model, scoreModel) {
      const start = Date.now();
      try {
        const data = await search(
          test.query,
          true,
          model,
          test.temperature,
          test.contextSize,
          null,
          null,
          test.tokenLimit,
          'Local Documents Only',
          test.testCode,
          test.collection,
          false,
          scoreModel,
          false,
          'ai-document-chat',
          test.topK
        );

        const elapsed = Date.now() - start;
        const dbSaved = await saveToDB({ ...data, testCode: test.testCode, tokenLimit: test.tokenLimit }, test);

        return {
          ...test, model, elapsed_ms: elapsed,
          accurate_score: data.scores?.accuracy || null,
          relevant_score: data.scores?.relevance || null,
          organized_score: data.scores?.organization || null,
          weighted_score_pct: data.scores?.total || null,
          error: null, db_saved: dbSaved
        };
      } catch(e) {
        return {
          ...test, model, elapsed_ms: Date.now() - start,
          accurate_score: null, relevant_score: null, organized_score: null, weighted_score_pct: null,
          error: e.message, db_saved: false
        };
      }
    }

    async function saveToDB(data, test) {
      try {
        await exportToDatabase(
          data,
          'A-002 Baseline',
          `A002-${test.id} ${test.type}: ${test.query.substring(0, 60)}`
        );
        return true;
      } catch(e) {
        console.error('DB save failed:', e.message);
        return false;
      }
    }

    function renderResultRow(r) {
      const container = document.getElementById('liveResults');
      const row = document.createElement('div');
      row.className = 'result-row';
      const scoreText = r.weighted_score_pct != null
        ? `<span class="score-pill">${r.weighted_score_pct}% (A:${r.accurate_score} R:${r.relevant_score} O:${r.organized_score})</span>`
        : r.error
          ? `<span style="color:#dc3545;font-size:0.75rem;">error</span>`
          : `<span style="color:var(--text-muted);font-size:0.75rem;">no score</span>`;
      row.innerHTML = `
        <span>
          <strong>${r.id}</strong>
          <span class="badge-${r.type}" style="margin:0 0.3rem;">${r.type}</span>
          <span style="color:var(--text-muted);font-size:0.75rem;">[${r.model}]</span>
          ${r.query.substring(0, 50)}${r.query.length > 50 ? '…' : ''}
        </span>
        <span style="display:flex;align-items:center;gap:0.5rem;">
          ${scoreText}
          <span class="elapsed">${(r.elapsed_ms/1000).toFixed(1)}s</span>
          <span class="db-badge">${r.db_saved ? '✅' : '❌'}</span>
        </span>`;
      container.appendChild(row);
    }

    function showSummary(models) {
      const scored = allResults.filter(r => r.weighted_score_pct != null);
      const avgScore = scored.length ? Math.round(scored.reduce((s, r) => s + r.weighted_score_pct, 0) / scored.length) : null;
      const avgMs = Math.round(allResults.reduce((s, r) => s + (r.elapsed_ms || 0), 0) / allResults.length);
      const dbSaved = allResults.filter(r => r.db_saved).length;

      document.getElementById('finalScore').textContent = avgScore != null ? `${avgScore}%` : '—';
      document.getElementById('finalPct').textContent = avgScore != null ? `average weighted score across ${scored.length} scored queries` : 'scoring unavailable';
      document.getElementById('finalMeta').textContent = `Models: ${models.join(', ')} · Avg time: ${(avgMs/1000).toFixed(1)}s`;
      document.getElementById('dbStatus').textContent = `💾 ${dbSaved}/${allResults.length} results saved to database`;
      document.getElementById('summarySection').classList.remove('hidden');
    }

    window.copyResults = function() {
      const scored = allResults.filter(r => r.weighted_score_pct != null);
      const avg = scored.length ? Math.round(scored.reduce((s, r) => s + r.weighted_score_pct, 0) / scored.length) : null;
      let text = `A-002 Collection Test Results\nAvg weighted score: ${avg ?? '—'}%\n\n`;
      allResults.forEach(r => {
        const score = r.weighted_score_pct != null ? `${r.weighted_score_pct}% (A:${r.accurate_score} R:${r.relevant_score} O:${r.organized_score})` : 'no score';
        text += `${r.id} [${r.type}] ${r.model}\n  ${r.testCode}\n  "${r.query}"\n  ${score} · ${(r.elapsed_ms/1000).toFixed(1)}s\n\n`;
      });
      navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
    };

    // ── Init ─────────────────────────────────────────────────────────────────
    renderTests();
    setupCheckboxes();
    loadModels();
  </script>

  <div id="footer-placeholder"></div>
</body>
</html>
