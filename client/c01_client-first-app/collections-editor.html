<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Collection - AIPrivateSearch</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script src="csrf.js"></script>
  <script src="shared/utils/apiConfig.js"></script>
  <script src="shared/license-checker.js"></script>
  <script src="shared/startup-license-check.js"></script>
  <script type="module" src="shared/common.js"></script>
  <script>
    // Load theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (!savedTheme) {
        localStorage.setItem('theme', theme);
      }
    })();
  </script>
  <style>
    .editor-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    
    .editor-section {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 10px var(--shadow);
    }
    
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .editor-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text-color);
    }
    
    .document-table-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-color);
    }
    
    .document-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    
    .document-table th {
      background: var(--card-bg);
      padding: 0.75rem 0.5rem;
      text-align: left;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold;
      color: var(--text-color);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    
    .document-table td {
      padding: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
    }
    
    .document-table tbody tr:hover {
      background: var(--card-bg);
    }
    
    .status-badge {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .status-yes {
      background: #27ae60;
      color: white;
    }
    
    .status-no {
      background: #95a5a6;
      color: white;
    }
    
    .ext-badge {
      background: #3498db;
      color: white;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    
    .filename-link {
      color: var(--text-color);
      text-decoration: none;
    }
    
    .filename-link:hover {
      text-decoration: underline;
    }
    
    .action-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    
    .btn-primary { background: #3498db; color: white; }
    .btn-success { background: #27ae60; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-info { background: #17a2b8; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    
    .btn:hover { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    [data-theme="dark"] h1 {
      color: #87ceeb;
    }
    
    .log-output {
      margin-top: 1rem;
      display: none;
    }
    
    .log-item {
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
    }
    
    .log-item.success {
      border-color: #28a745;
      background: #d4edda;
      color: var(--text-color);
    }
    
    .log-item.error {
      border-color: #dc3545;
      background: #f8d7da;
      color: var(--text-color);
    }
    
    .log-item.info {
      border-color: #17a2b8;
      background: #d1ecf1;
      color: var(--text-color);
    }
    
    .log-item.processing {
      border-color: #f39c12;
      background: #f39c12;
      color: #2c3e50;
      font-weight: bold;
    }
    
    [data-theme="dark"] .log-item.success {
      background: #1e4d3a;
      color: var(--text-color);
    }
    
    [data-theme="dark"] .log-item.error {
      background: #4d1e1e;
      color: var(--text-color);
    }
    
    [data-theme="dark"] .log-item.info {
      background: #1e3a4d;
      color: var(--text-color);
    }
    
    [data-theme="dark"] .log-item.processing {
      background: #2d5a2d;
      color: #e0e0e0;
      border-color: #2d5a2d;
    }
    
    /* doc-index-edit-only visibility controlled by tier access manager */
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-content">
    <main class="editor-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <h1 id="collectionTitle">Edit Collection</h1>
          <p>Manage documents and perform operations on this collection.</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-danger admin-only" onclick="removeCollection()">Remove Collection</button>
          <button class="btn btn-info" onclick="goBack()">Back to Collections</button>
        </div>
      </div>
      
      <div class="editor-section">
        <div style="display: flex; gap: 1rem; align-items: center;">
          <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFileSelection()">
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Add Document</button>
        </div>
      </div>
      
      <div class="editor-section">
        <div class="editor-header">
          <div class="editor-title">Documents</div>
        </div>
        <div class="document-table-container">
          <table class="document-table" id="documentTable">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAllDocs"></th>
                <th>Filename</th>
                <th>Source</th>
                <th>Converted</th>
                <th>Index</th>
                <th>Embedded</th>
              </tr>
            </thead>
            <tbody id="documentTableBody">
              <tr>
                <td colspan="6">Loading documents...</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="action-buttons">
          <button class="btn btn-success" onclick="processSourceFiles()">Process Source Files</button>
          <button class="btn btn-danger" onclick="deleteDocuments()">Remove from Collection</button>
        </div>
        
        <div class="action-buttons doc-index-edit-only">
          <button class="btn btn-warning" onclick="convertDocuments()">Convert Source Files</button>
          <button class="btn btn-info" onclick="generateDocumentIndex()">Create Doc Index Cards</button>
          <button class="btn btn-danger" onclick="removeIndexCards()">Remove Index Cards</button>
          <button class="btn btn-primary" onclick="processDocuments()">Embed Converted Files</button>
          <button class="btn btn-danger" onclick="removeEmbeddings()">Remove Embeds</button>
          <button class="btn btn-success" onclick="testSearch()">Test Search</button>
          <button class="btn btn-info" onclick="viewEmbeddings()">View Embeds</button>
          <button class="btn btn-success" onclick="generateFabricPatternOnly()">✨ Generate Fabric Pattern</button>
          <button class="btn btn-info" onclick="viewFabricPattern()">✨ View/Edit Fabric Pattern</button>
        </div>
      </div>
      
      <div id="logOutput" class="log-output"></div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    let currentCollection = '';
    let documents = [];
    let indexedDocuments = [];
    let metadataDocuments = [];
    let isProcessing = false;
    
    // Global processing state management
    function setProcessingState(processing) {
      isProcessing = processing;
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach(btn => {
        btn.disabled = processing;
        if (processing) {
          btn.classList.add('processing-button');
        } else {
          btn.classList.remove('processing-button');
        }
      });
    }
    
    // Get collection name from URL parameter or sessionStorage fallback
    const urlParams = new URLSearchParams(window.location.search);
    const urlCollection = urlParams.get('collection');
    const storedCollection = sessionStorage.getItem('currentCollection');
    
    if (urlCollection) {
      currentCollection = urlCollection;
      // Store in sessionStorage for refresh persistence
      sessionStorage.setItem('currentCollection', currentCollection);
    } else if (storedCollection) {
      currentCollection = storedCollection;
    }
    
    if (currentCollection) {
      document.getElementById('collectionTitle').textContent = `Edit Collection: ${currentCollection}`;
      loadDocuments();
    } else {
      showError('No collection specified');
    }
    
    // Apply tier access restrictions after page loads
    setTimeout(async () => {
      console.log('DEBUG: Checking doc index edit access...');
      console.log('DEBUG: tierAccessManager exists:', !!window.tierAccessManager);
      console.log('DEBUG: localStorage userRole:', localStorage.getItem('userRole'));
      console.log('DEBUG: localStorage userUserRole:', localStorage.getItem('userUserRole'));
      
      if (window.tierAccessManager) {
        const userInfo = window.tierAccessManager.getCurrentUserInfo();
        console.log('DEBUG: Current user info:', userInfo);
        
        const userType = await window.tierAccessManager.getUserTypeInfo(userInfo.tier, userInfo.role);
        console.log('DEBUG: User type config:', userType);
        
        // Check doc index edit buttons
        const docEditButtons = document.querySelectorAll('.doc-index-edit-only');
        console.log('DEBUG: Found doc-index-edit-only elements:', docEditButtons.length);
        docEditButtons.forEach((btn, i) => {
          console.log(`DEBUG: Doc edit button ${i}:`, btn.textContent, 'display:', window.getComputedStyle(btn).display);
        });
        
        // Check if should show doc-index-edit-only
        const shouldShow = userType.cssShow && userType.cssShow.includes('.doc-index-edit-only');
        const shouldHide = userType.cssHide && userType.cssHide.includes('.doc-index-edit-only');
        console.log('DEBUG: Should show doc-index-edit-only:', shouldShow);
        console.log('DEBUG: Should hide doc-index-edit-only:', shouldHide);
        
        window.tierAccessManager.applyAccessControl();
        
        // Check buttons after access control
        setTimeout(() => {
          docEditButtons.forEach((btn, i) => {
            console.log(`DEBUG: After access control - Doc edit button ${i}:`, btn.textContent, 'display:', window.getComputedStyle(btn).display);
          });
        }, 100);
      }
    }, 200);
    

    
    async function loadDocuments() {
      try {
        const [filesResponse, indexedResponse, documentIndexResponse] = await Promise.all([
          fetch(`${window.API_BASE_URL}/api/documents/collections/${currentCollection}/files?t=${Date.now()}`),
          fetch(`${window.API_BASE_URL}/api/documents/collections/${currentCollection}/indexed`),
          fetch(`${window.API_BASE_URL}/api/multi-search/document-index-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collection: currentCollection })
          })
        ]);
        
        const filesData = await filesResponse.json();
        const indexedData = await indexedResponse.json();
        const documentIndexData = await documentIndexResponse.json();
        
        // Support both manifest and legacy folder-scan responses
        if (filesData.manifest) {
          // Manifest mode — rich document objects
          documents = filesData.files || [];
          window._collectionHasManifest = true;
        } else {
          // Legacy mode — plain filename strings
          documents = filesData.files || [];
          window._collectionHasManifest = false;
        }
        indexedDocuments = indexedData.documents || [];
        metadataDocuments = documentIndexData.documents || [];
        renderDocuments();
      } catch (error) {
        console.error('Error loading documents:', error);
        showError('Failed to load documents');
      }
    }
    
    function renderDocuments() {
      const tbody = document.getElementById('documentTableBody');
      tbody.innerHTML = '';
      
      // Load saved selections
      const savedSelections = JSON.parse(sessionStorage.getItem(`selections_${currentCollection}`) || '[]');
      
      // Group documents by base name
      const docGroups = new Map();
      
      documents.forEach(doc => {
        // Support both manifest objects and legacy filename strings
        const isManifestDoc = typeof doc === 'object' && doc.sourceExt !== undefined;
        const fileName = isManifestDoc ? (doc.convertedFile || `${doc.name}.${doc.sourceExt}`) : (typeof doc === 'string' ? doc : doc.name);
        const sourceFileName = isManifestDoc ? `${doc.name}.${doc.sourceExt}` : null;
        const sourceExt = isManifestDoc ? doc.sourceExt : null;

        // Skip database and system files (legacy mode)
        if (!isManifestDoc && (fileName === 'index-cards.db' || fileName === 'embeddings.db' || fileName === 'fabric-pattern.md' || fileName === 'collection.json')) {
          return;
        }
        // Manifest mode — use rich metadata directly
        if (isManifestDoc) {
          const baseName = doc.name;
          if (!docGroups.has(baseName)) {
            docGroups.set(baseName, { baseName, sourceFiles: [], mdFile: null, metaFile: null });
          }
          const group = docGroups.get(baseName);
          if (doc.convertedFile) group.mdFile = doc.convertedFile;
          group.sourceFiles.push({ fileName: sourceFileName, ext: sourceExt, size: 0 });
          return;
        }

        const ext = fileName.split('.').pop().toLowerCase();
        
        // Handle META_ files - associate them with their base document
        if (fileName.startsWith('META_')) {
          const baseFileName = fileName.substring(5); // Remove 'META_' prefix
          const baseName = baseFileName.substring(0, baseFileName.lastIndexOf('.')) || baseFileName;
          
          if (!docGroups.has(baseName)) {
            docGroups.set(baseName, {
              baseName,
              sourceFiles: [],
              mdFile: null,
              metaFile: null
            });
          }
          
          docGroups.get(baseName).metaFile = fileName;
          return; // Don't process META_ files as regular documents
        }
        
        // Handle regular files
        const baseName = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
        
        if (!docGroups.has(baseName)) {
          docGroups.set(baseName, {
            baseName,
            sourceFiles: [],
            mdFile: null,
            metaFile: null
          });
        }
        
        const group = docGroups.get(baseName);
        
        if (ext === 'md') {
          group.mdFile = fileName;
        } else {
          group.sourceFiles.push({ fileName, ext, size: typeof doc === 'string' ? 0 : doc.size });
        }
      });
      
      const allGroups = Array.from(docGroups.values());
      
      if (allGroups.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">No documents found</td></tr>';
        return;
      }
      
      allGroups.forEach(group => {
        const row = document.createElement('tr');
        
        // Find if this document's source MD file is embedded (exclude META files)
        const isEmbedded = indexedDocuments.some(doc => 
          doc.filename === group.mdFile && doc.inLanceDB
        );
        
        // Create source extension links (exclude .md files)
        const nonMdSources = group.sourceFiles.filter(f => f.ext !== 'md');
        const sourceLinks = nonMdSources.map(f => 
          `<a href="#" onclick="openFile('${f.fileName}')" class="ext-badge">${f.ext}</a>`
        ).join(' ');
        const hasSource = nonMdSources.length > 0;
        const hasMd = !!group.mdFile;
        
        // Create MD/JSON link or status
        let mdContent;
        if (hasMd) {
          // Check if this is a collection file (xxx-xxx_Collection.md or xxx-xxx_collections.md pattern)
          if (group.mdFile && group.mdFile.match(/.*-.*_[Cc]ollections?\.md$/)) {
            mdContent = '-';
          } else {
            // Show appropriate badge based on file extension
            const fileExt = group.mdFile.split('.').pop().toLowerCase();
            const badgeText = fileExt === 'json' ? 'JSON' : 'MD';
            mdContent = `<a href="#" onclick="openFile('${group.mdFile}')" class="ext-badge">${badgeText}</a>`;
          }
        } else if (group.metaFile && group.metaFile.match(/^META_.*-.*_[Cc]ollection\.md$/)) {
          // Show dash for META collection files in Converted column when no regular MD file exists
          mdContent = '-';
        } else {
          mdContent = `<span class="status-badge status-no">○</span>`;
        }
        
        // Create Index link or status (based on SQLite database)
        const hasDocumentIndex = group.mdFile && metadataDocuments.some(doc => doc.filename === group.mdFile);
        const indexContent = hasDocumentIndex ? 
          `<a href="#" onclick="viewDocumentIndex('${group.mdFile}')" class="ext-badge">Card</a>` :
          `<span class="status-badge status-no">○</span>`;
        
        // Check if this is a collection meta file to show dash in Embedded column
        const isCollectionMeta = group.metaFile && group.metaFile.match(/^META_.*-.*_[Cc]ollection\.md$/);
        
        // Determine which files to include in selection (exclude META files since they're in database)
        const selectableFiles = [];
        if (hasSource) selectableFiles.push(...group.sourceFiles.map(f => f.fileName));
        else if (hasMd) selectableFiles.push(group.mdFile); // legacy: no source, use md
        
        const isSelected = savedSelections.includes(selectableFiles.join(','));
        row.innerHTML = `
          <td>
            <input type="checkbox" class="document-checkbox" value="${selectableFiles.join(',')}" data-basename="${group.baseName}" ${isSelected ? 'checked' : ''}>
          </td>
          <td>
            <a href="#" onclick="openFile('${group.mdFile || group.sourceFiles[0]?.fileName}')" class="filename-link">
              ${group.baseName}
            </a>
          </td>
          <td>
            ${hasSource ? sourceLinks : '-'}
          </td>
          <td>
            ${mdContent}
          </td>
          <td>
            ${indexContent}
          </td>
          <td>
            ${isCollectionMeta ? '-' : `<span class="status-badge ${isEmbedded ? 'status-yes' : 'status-no'}">${isEmbedded ? '✓' : '○'}</span>`}
          </td>
        `;
        
        tbody.appendChild(row);
      });
      
      setupCheckboxListeners();
    }
    

    
    function setupCheckboxListeners() {
      const selectAll = document.getElementById('selectAllDocs');
      const checkboxes = document.querySelectorAll('.document-checkbox');
      
      selectAll.addEventListener('change', function() {
        checkboxes.forEach(cb => cb.checked = this.checked);
        saveSelections();
      });
      
      checkboxes.forEach(cb => {
        cb.addEventListener('change', function() {
          const allChecked = Array.from(checkboxes).every(checkbox => checkbox.checked);
          const noneChecked = Array.from(checkboxes).every(checkbox => !checkbox.checked);
          selectAll.checked = allChecked;
          selectAll.indeterminate = !allChecked && !noneChecked;
          saveSelections();
        });
      });
    }
    
    function saveSelections() {
      const selected = Array.from(document.querySelectorAll('.document-checkbox:checked')).map(cb => cb.value);
      sessionStorage.setItem(`selections_${currentCollection}`, JSON.stringify(selected));
    }
    
    function clearSelections() {
      sessionStorage.removeItem(`selections_${currentCollection}`);
    }
    
    function getSelectedDocuments() {
      const selected = [];
      document.querySelectorAll('.document-checkbox:checked').forEach(cb => {
        const files = cb.value.split(',');
        selected.push(...files);
      });
      return selected;
    }
    
    async function handleFileSelection() {
      const fileInput = document.getElementById('fileInput');
      const files = fileInput.files;
      
      if (files.length === 0) {
        return;
      }
      
      setProcessingState(true);
      clearLog();
      showLog(`Adding ${files.length} file(s) to collection...`);
      
      try {
        for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const progress = `${i + 1}/${files.length}`;
        showLog(`${progress} Adding: ${file.name}`);
        
        try {
          const formData = new FormData();
          formData.append('file', file);
          
          const response = await window.csrfManager.fetch(`${window.API_BASE_URL}/api/documents/collections/${currentCollection}/upload`, {
            method: 'POST',
            body: formData
          });
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          const contentType = response.headers.get('content-type');
          if (!contentType || !contentType.includes('application/json')) {
            const text = await response.text();
            throw new Error(`Server returned non-JSON response: ${text.substring(0, 200)}`);
          }
          
          const result = await response.json();
          
          if (result.success) {
            showLog(`${progress} ✓ Added: ${file.name}`, 'success');
          } else {
            showLog(`${progress} ✗ Failed to add: ${file.name} - ${result.error}`, 'error');
          }
        } catch (error) {
          showLog(`${progress} ✗ Error adding: ${file.name} - ${error.message}`, 'error');
        }
          showLog(''); // Add blank line after each file
        }
        
        showLog(`✓ File addition complete: ${files.length} files processed`, 'success');
        fileInput.value = ''; // Clear the file input
        loadDocuments(); // Refresh the document list
      } finally {
        setProcessingState(false);
      }
    }
    
    async function processSourceFiles() {
      const selected = getSelectedDocuments();
      if (selected.length === 0) {
        showUserMessage('Please select source files to process', 'error');
        return;
      }
      
      if (!await secureConfirm(`Process ${selected.length} selected files?\n\nThis will:\n1. Convert all files to Markdown\n2. Create Doc Index Cards\n3. Embed Converted Files\n\nThis may take several minutes.`)) {
        return;
      }
      
      setProcessingState(true);
      const totalStartTime = Date.now();
      clearLog();
      showLog(`=== PROCESSING ${selected.length} SOURCE FILES ===`, 'processing');
      
      try {
        // Step 1: Convert Documents
        showLog(`\n--- STEP 1: CONVERTING FILES ---`, 'processing');
        const convertResponse = await window.csrfManager.fetch(`${window.API_BASE_URL}/api/documents/convert-selected`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ collection: currentCollection, files: selected })
        });
        
        const convertResult = await convertResponse.json();
        
        if (convertResult.success) {
          showLog(`✓ Conversion complete: ${convertResult.converted} files converted`, 'success');
        } else {
          showLog(`✗ Conversion failed: ${convertResult.error}`, 'error');
          return;
        }
        
        // Refresh document list to get converted files
        await loadDocuments();
        
        // Get converted files for next steps
        // Build expected .md filenames from selected source files
        const convertedFiles = selected.map(file => {
          const baseName = file.substring(0, file.lastIndexOf('.')) || file;
          return baseName + '.md';
        });
        
        if (convertedFiles.length === 0) {
          showLog(`✗ No converted files found to process further`, 'error');
          return;
        }
        
        // Step 2: Create Doc Index Cards
        showLog(`\n--- STEP 2: CREATING DOC INDEX CARDS ---`, 'processing');
        for (let i = 0; i < convertedFiles.length; i++) {
          const fileName = convertedFiles[i];
          const progress = `${i + 1}/${convertedFiles.length}`;
          const fileStartTime = Date.now();
          
          try {
            showLog(`${progress} Creating index: ${fileName}`, 'processing');
            
            const response = await window.csrfManager.fetch(`${window.API_BASE_URL}/api/multi-search/document-index-create-single`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ collection: currentCollection, filename: fileName })
            });
            
            const result = await response.json();
            const fileElapsed = ((Date.now() - fileStartTime) / 1000).toFixed(1);
            
            if (result.success) {
              const docIdInfo = result.docId ? ` (DocID: ${result.docId})` : '';
              showLog(`${progress} ✓ Index created: ${fileName}${docIdInfo} (${fileElapsed}s)`, 'success');
            } else {
              showLog(`${progress} ✗ Index failed: ${fileName} - ${result.error} (${fileElapsed}s)`, 'error');
            }
          } catch (error) {
            const fileElapsed = ((Date.now() - fileStartTime) / 1000).toFixed(1);
            showLog(`${progress} ✗ Index error: ${fileName} - ${error.message} (${fileElapsed}s)`, 'error');
          }
        }

        // Step 2b: Generate Fabric pattern from all collection documents (fire-and-forget)
        fetch(`${window.API_BASE_URL}/api/fabric/generate-pattern`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('sessionId')}` },
          body: JSON.stringify({ collection: currentCollection })
        }).then(r => r.json()).then(data => {
          if (data.success) showLog(`✨ Fabric pattern generated for ${currentCollection} (${data.docCount} docs)`, 'success');
          else showLog(`⚠️ Fabric pattern skipped: ${data.error || data.reason || 'unknown'}`, 'warning');
        }).catch(() => showLog(`⚠️ Fabric pattern generation skipped (Fabric not configured)`, 'warning'));

        // Step 3: Embed Converted Files
        showLog(`\n--- STEP 3: EMBEDDING CONVERTED FILES ---`, 'processing');
        for (let i = 0; i < convertedFiles.length; i++) {
          const fileName = convertedFiles[i];
          const progress = `${i + 1}/${convertedFiles.length}`;
          const fileStartTime = Date.now();
          
          try {
            showLog(`${progress} Embedding: ${fileName}`, 'processing');
            
            const response = await window.csrfManager.fetch(`${window.API_BASE_URL}/api/documents/collections/${currentCollection}/index/${fileName}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({})
            });
            
            const result = await response.json();
            const fileElapsed = ((Date.now() - fileStartTime) / 1000).toFixed(1);
            
            if (result.success) {
              const chunkInfo = result.chunks ? ` (${result.chunks} chunks)` : '';
              const reuseInfo = result.reused ? ' [reused]' : ' [new]';
              showLog(`${progress} ✓ Embedded: ${fileName}${chunkInfo}${reuseInfo} (${formatTime(fileElapsed)})`, 'success');
            } else {
              showLog(`${progress} ✗ Embed failed: ${fileName} - ${result.error} (${formatTime(fileElapsed)})`, 'error');
            }
          } catch (error) {
            const fileElapsed = ((Date.now() - fileStartTime) / 1000).toFixed(1);
            showLog(`${progress} ✗ Embed error: ${fileName} - ${error.message} (${formatTime(fileElapsed)})`, 'error');
          }
        }
        
        const totalElapsed = ((Date.now() - totalStartTime) / 1000).toFixed(1);
        showLog(`\n=== PROCESSING COMPLETE ===`, 'success');
        showLog(`✓ ${selected.length} source files processed in ${formatTime(totalElapsed)}`, 'success');
        showLog(`Files are now ready for search and analysis`, 'info');
        
        // Refresh document list to show final status
        await loadDocuments();
        
      } catch (error) {
        showLog(`✗ Processing error: ${error.message}`, 'error');
      } finally {
        setProcessingState(false);
      }
    }

    function formatTime(seconds) {

      }
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = (seconds % 60).toFixed(1);
      return `${minutes}m ${remainingSeconds}s`;
    }

        source: document.getElementById('indexSource') ? document.getElementById('indexSource').value : '',
        version: document.getElementById('indexVersion') ? document.getElementById('indexVersion').value : '',
        access_level: document.getElementById('indexAccessLevel') ? document.getElementById('indexAccessLevel').value : '',
        license: document.getElementById('indexLicense') ? document.getElementById('indexLicense').value : '',
        category: document.getElementById('indexCategory') ? document.getElementById('indexCategory').value : '',
        summary: document.getElementById('indexSummary') ? document.getElementById('indexSummary').value : '',
        topics: document.getElementById('indexTopics') ? document.getElementById('indexTopics').value : '',
        keywords: document.getElementById('indexKeywords') ? document.getElementById('indexKeywords').value : '',
        key_phrases: document.getElementById('indexKeyPhrases') ? document.getElementById('indexKeyPhrases').value : '',
        sentiment: document.getElementById('indexSentiment') ? document.getElementById('indexSentiment').value : '',
        entities: document.getElementById('indexEntities') ? document.getElementById('indexEntities').value : '',
        dates_mentioned: document.getElementById('indexDatesMentioned') ? document.getElementById('indexDatesMentioned').value : '',
        amounts_mentioned: document.getElementById('indexAmountsMentioned') ? document.getElementById('indexAmountsMentioned').value : '',
        action_items: document.getElementById('indexActionItems') ? document.getElementById('indexActionItems').value : '',
        importance_level: document.getElementById('indexImportanceLevel') ? document.getElementById('indexImportanceLevel').value : '',
        complexity_score: document.getElementById('indexComplexityScore') ? document.getElementById('indexComplexityScore').value : '',
        our_comments: document.getElementById('indexComments') ? document.getElementById('indexComments').value : ''
      };
      
      try {
        const response = await window.csrfManager.fetch(`${window.API_BASE_URL}/api/multi-search/document-index-update-all`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedDocumentIndex)
        });
        
        const result = await response.json();
        
        if (result.success) {
          showLog(`✓ Doc Index saved successfully`, 'success');
          window.formChanged = false;
          closeDocumentIndexEditor();
        } else {
          showLog(`✗ Failed to save Doc Index: ${result.error}`, 'error');
        }
      } catch (error) {
        showLog(`✗ Error saving Doc Index: ${error.message}`, 'error');
      }
    }
    
    function exportDocumentIndex() {
      // Get current document index from form
      const exportData = {
        doc_id: window.currentDocumentIndex.doc_id,
        collection: window.currentDocumentIndex.collection,
        filename: window.currentDocumentIndex.filename,
        file_type: window.currentDocumentIndex.file_type,
        file_size: window.currentDocumentIndex.file_size,
        created_date: window.currentDocumentIndex.created_date,
        last_modified_date: window.currentDocumentIndex.last_modified_date,
        author: document.getElementById('indexAuthor') ? document.getElementById('indexAuthor').value : window.currentDocumentIndex.author,
        document_type: document.getElementById('indexDocumentType') ? document.getElementById('indexDocumentType').value : window.currentDocumentIndex.document_type,
        language: document.getElementById('indexLanguage') ? document.getElementById('indexLanguage').value : window.currentDocumentIndex.language,
        source: document.getElementById('indexSource') ? document.getElementById('indexSource').value : window.currentDocumentIndex.source,
        version: document.getElementById('indexVersion') ? document.getElementById('indexVersion').value : window.currentDocumentIndex.version,
        word_count: window.currentDocumentIndex.word_count,
        access_level: document.getElementById('indexAccessLevel') ? document.getElementById('indexAccessLevel').value : window.currentDocumentIndex.access_level,
        license: document.getElementById('indexLicense') ? document.getElementById('indexLicense').value : window.currentDocumentIndex.license,
        title: document.getElementById('indexTitle') ? document.getElementById('indexTitle').value : window.currentDocumentIndex.title,
        summary: document.getElementById('indexSummary') ? document.getElementById('indexSummary').value : window.currentDocumentIndex.summary,
        topics: document.getElementById('indexTopics') ? document.getElementById('indexTopics').value : window.currentDocumentIndex.topics,
        keywords: document.getElementById('indexKeywords') ? document.getElementById('indexKeywords').value : window.currentDocumentIndex.keywords,
        key_phrases: document.getElementById('indexKeyPhrases') ? document.getElementById('indexKeyPhrases').value : window.currentDocumentIndex.key_phrases,
        category: document.getElementById('indexCategory') ? document.getElementById('indexCategory').value : window.currentDocumentIndex.category,
        sentiment: document.getElementById('indexSentiment') ? document.getElementById('indexSentiment').value : window.currentDocumentIndex.sentiment,
        entities: document.getElementById('indexEntities') ? document.getElementById('indexEntities').value : window.currentDocumentIndex.entities,
        dates_mentioned: document.getElementById('indexDatesMentioned') ? document.getElementById('indexDatesMentioned').value : window.currentDocumentIndex.dates_mentioned,
        amounts_mentioned: document.getElementById('indexAmountsMentioned') ? document.getElementById('indexAmountsMentioned').value : window.currentDocumentIndex.amounts_mentioned,
        action_items: document.getElementById('indexActionItems') ? document.getElementById('indexActionItems').value : window.currentDocumentIndex.action_items,
        importance_level: document.getElementById('indexImportanceLevel') ? document.getElementById('indexImportanceLevel').value : window.currentDocumentIndex.importance_level,
        complexity_score: document.getElementById('indexComplexityScore') ? document.getElementById('indexComplexityScore').value : window.currentDocumentIndex.complexity_score,
        reading_time: window.currentDocumentIndex.reading_time,
        paragraphs: window.currentDocumentIndex.paragraphs,
        sentences: window.currentDocumentIndex.sentences,
        character_count: window.currentDocumentIndex.character_count,
        unique_word_count: window.currentDocumentIndex.unique_word_count,
        average_sentence_length: window.currentDocumentIndex.average_sentence_length,
        generated_date: window.currentDocumentIndex.generated_date,
        our_comments: document.getElementById('indexComments') ? document.getElementById('indexComments').value : window.currentDocumentIndex.our_comments
      };
      
      // Create filename with timestamp
      const now = new Date();
      const timestamp = now.getFullYear() + 
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');
      
      const docName = (exportData.filename || 'document').replace(/\.[^/.]+$/, '');
      const filename = `${exportData.collection}-${docName}-${timestamp}.json`;
      
      // Create and download file
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showLog(`✓ Doc Index exported to ${filename}`, 'success');
    }
    
    function markFormChanged() {
      window.formChanged = true;
    }
    
    async function removeIndexCards() {
      const selected = getSelectedDocuments();
      const selectedFiles = selected.filter(file => (file.endsWith('.md') || file.endsWith('.json')) && !file.startsWith('META_'));
      
      if (selectedFiles.length === 0) {
        showUserMessage('Please select at least one converted file (MD or JSON) to remove index cards from', 'error');
        return;
      }
      
      if (!await secureConfirm(`Remove Doc Index cards for ${selectedFiles.length} selected files from SQLite database?\n\nThis will permanently delete the index card entries but keep the source files.`)) {
        return;
      }
      
      setProcessingState(true);
      clearLog();
      showLog(`Removing Doc Index cards for ${selectedFiles.length} selected files...`);
      
      try {
        for (let i = 0; i < selectedFiles.length; i++) {
          const filename = selectedFiles[i];
          const progress = `${i + 1}/${selectedFiles.length}`;
          
          try {
            const response = await window.csrfManager.fetch(`${window.API_BASE_URL}/api/multi-search/document-index-remove`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ collection: currentCollection, filename })
            });
            
            const result = await response.json();
            
            if (result.success) {
              showLog(`${progress} ✓ Removed index card: ${filename}`, 'success');
            } else {
              showLog(`${progress} ✗ Failed: ${filename} - ${result.error}`, 'error');
            }
          } catch (error) {
            showLog(`${progress} ✗ Error: ${filename} - ${error.message}`, 'error');
          }
        }
        
        showLog(`✓ Index card removal complete: ${selectedFiles.length} files processed`, 'success');
        loadDocuments();
      } finally {
        setProcessingState(false);
      }
    }
    
    function closeDocumentIndexEditor() {
      if (window.formChanged) {
        if (!confirm('You have unsaved changes. Are you sure you want to close without saving?')) {
          return;
        }
      }
      
      if (window.currentDocumentIndexModal) {
        document.body.removeChild(window.currentDocumentIndexModal);
        window.currentDocumentIndexModal = null;
        window.currentDocumentIndex = null;
        window.formChanged = false;
        
        // Remove ESC key handler
        if (window.currentEscHandler) {
          document.removeEventListener('keydown', window.currentEscHandler);
          window.currentEscHandler = null;
        }
      }
    }
  </script>

  <!-- Fabric Pattern Modal -->
  <div id="fabricPatternModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:var(--card-bg); border-radius:8px; padding:2rem; max-width:750px; width:90%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg);">
      <h3 style="margin-bottom:0.5rem; color:var(--text-color)">✨ Fabric Pattern: <span id="fabricPatternName" style="color:var(--primary);"></span></h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">This pattern is used to enhance prompts for this collection. Edit and save to update on the Fabric server.</p>
      <textarea id="fabricPatternText" style="width:100%; height:300px; padding:0.75rem; background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); border-radius:4px; font-size:0.85rem; font-family:monospace; resize:vertical;"></textarea>
      <div id="fabricPatternStatus" style="font-size:0.85rem; color:var(--text-muted); margin-top:0.5rem; min-height:1.2rem;"></div>
      <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1rem;">
        <button onclick="document.getElementById('fabricPatternModal').style.display='none'" style="padding:0.6rem 1.2rem; border:1px solid var(--border-color); border-radius:4px; background:transparent; color:var(--text-color); cursor:pointer;">Close</button>
        <button onclick="saveFabricPattern()" style="padding:0.6rem 1.2rem; border:none; border-radius:4px; background:var(--primary); color:white; cursor:pointer; font-weight:600;">Save</button>
      </div>
    </div>
  </div>

  <script>
    async function generateFabricPatternOnly() {
      showLog(`\n--- GENERATING FABRIC PATTERN ---`, 'processing');
      try {
        const response = await fetch(`${window.API_BASE_URL}/api/fabric/generate-pattern`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('sessionId')}` },
          body: JSON.stringify({ collection: currentCollection })
        });
        const data = await response.json();
        if (data.success) showLog(`✨ Fabric pattern generated for ${currentCollection} (${data.docCount} docs)`, 'success');
        else showLog(`⚠️ Fabric pattern skipped: ${data.error || data.reason || 'unknown'}`, 'warning');
      } catch (err) {
        showLog(`✗ Fabric pattern generation failed: ${err.message}`, 'error');
      }
    }

    async function viewFabricPattern() {
      const patternName = `enhance_${currentCollection}`;
      document.getElementById('fabricPatternName').textContent = patternName;
      document.getElementById('fabricPatternText').value = 'Loading...';
      document.getElementById('fabricPatternStatus').textContent = '';
      document.getElementById('fabricPatternModal').style.display = 'flex';

      try {
        const response = await fetch(`${window.API_BASE_URL}/api/fabric/pattern/${encodeURIComponent(currentCollection)}`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('sessionId')}` }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to load pattern');
        document.getElementById('fabricPatternText').value = data.pattern || '';
        document.getElementById('fabricPatternStatus').textContent = data.exists ? 'Pattern loaded from local collection folder.' : 'No pattern exists yet — click Generate Fabric Pattern to create one.';
      } catch (err) {
        document.getElementById('fabricPatternText').value = '';
        document.getElementById('fabricPatternStatus').textContent = `⚠️ ${err.message}`;
      }
    }

    async function saveFabricPattern() {
      const pattern = document.getElementById('fabricPatternText').value.trim();
      if (!pattern) return;
      document.getElementById('fabricPatternStatus').textContent = 'Saving...';

      try {
        const response = await fetch(`${window.API_BASE_URL}/api/fabric/pattern/${encodeURIComponent(currentCollection)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('sessionId')}` },
          body: JSON.stringify({ pattern })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Save failed');
        document.getElementById('fabricPatternStatus').textContent = '✅ Pattern saved to collection folder.';
      } catch (err) {
        document.getElementById('fabricPatternStatus').textContent = `✗ ${err.message}`;
      }
    }
  </script>
